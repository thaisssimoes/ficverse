<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Lollipopfics</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Fanfics Interativas</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="login.html" class="nav-link">Login</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card" style="max-width: 500px; margin: 2rem auto;">
                <h2 style="margin-bottom: 0.5rem; color: var(--intense-purple);">Redefinir senha</h2>
                <p style="margin-bottom: 1.5rem; color: var(--text-muted, #666);">
                    Digite sua nova senha abaixo.
                </p>

                <div id="invalid-token-msg" style="display:none; background-color: var(--pastel-pink, #ffd6e0); color: var(--intense-pink, #c0003c); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center;">
                    Link inválido ou expirado. <a href="forgot-password.html" style="color: inherit; text-decoration: underline;">Solicite um novo link.</a>
                </div>

                <form id="reset-password-form">
                    <div class="form-group">
                        <label class="form-label" for="password">Nova senha</label>
                        <input type="password" id="password" class="form-input" required placeholder="Mínimo 8 caracteres" minlength="8">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm-password">Confirmar nova senha</label>
                        <input type="password" id="confirm-password" class="form-input" required placeholder="Repita a nova senha">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Redefinir senha</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                document.getElementById('invalid-token-msg').style.display = 'block';
                document.getElementById('reset-password-form').style.display = 'none';
                return;
            }

            const form = document.getElementById('reset-password-form');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm-password');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                removeMessages(form);

                const password = passwordInput.value;
                const confirm = confirmInput.value;

                if (password.length < 8) {
                    showFieldError(passwordInput, 'Senha deve ter pelo menos 8 caracteres');
                    return;
                }

                if (password !== confirm) {
                    showFieldError(confirmInput, 'As senhas não coincidem');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Redefinindo...';

                try {
                    await api.resetPassword(token, password);
                    showMessage(form, 'Senha redefinida com sucesso! Redirecionando para o login...', 'success');
                    form.reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 2500);
                } catch (error) {
                    const msg = error.message || 'Erro ao redefinir senha. O link pode ter expirado.';
                    showMessage(form, msg, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir senha';
                }
            });

            function showFieldError(input, message) {
                const existing = input.parentElement.querySelector('.field-error');
                if (existing) existing.remove();
                input.classList.add('error');
                const span = document.createElement('span');
                span.className = 'field-error';
                span.style.cssText = 'color: var(--intense-pink, #c0003c); font-size: 0.875rem; margin-top: 0.25rem; display: block;';
                span.textContent = message;
                input.parentElement.appendChild(span);
            }

            function showMessage(formEl, message, type) {
                removeMessages(formEl);
                const div = document.createElement('div');
                div.className = 'reset-message';
                if (type === 'success') {
                    div.style.cssText = 'background-color: var(--pastel-blue, #d0e8ff); color: var(--intense-blue, #0057b7); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center;';
                } else {
                    div.style.cssText = 'background-color: var(--pastel-pink, #ffd6e0); color: var(--intense-pink, #c0003c); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center;';
                }
                div.textContent = message;
                formEl.insertBefore(div, formEl.firstChild);
            }

            function removeMessages(formEl) {
                const existing = formEl.querySelector('.reset-message');
                if (existing) existing.remove();
                formEl.querySelectorAll('.field-error').forEach(el => el.remove());
                formEl.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
            }
        });
    </script>
</body>
</html>
