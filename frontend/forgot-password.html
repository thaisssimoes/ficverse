<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - Lollipopfics</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Fanfics Interativas</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="nav-link">Registrar</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card" style="max-width: 500px; margin: 2rem auto;">
                <h2 style="margin-bottom: 0.5rem; color: var(--intense-purple);">Esqueci minha senha</h2>
                <p style="margin-bottom: 1.5rem; color: var(--text-muted, #666);">
                    Digite seu email e enviaremos um link para redefinir sua senha.
                </p>
                <form id="forgot-password-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" required placeholder="seu@email.com">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar link de recuperação</button>
                </form>
                <p style="margin-top: 1rem; text-align: center;">
                    Lembrou a senha? <a href="login.html" style="color: var(--intense-purple);">Voltar ao login</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-password-form');
            const emailInput = document.getElementById('email');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                removeMessages(form);

                try {
                    await api.forgotPassword(emailInput.value.trim());
                    showMessage(form, 'Se este email estiver cadastrado, você receberá as instruções em breve. Verifique sua caixa de entrada.', 'success');
                    form.reset();
                } catch (error) {
                    showMessage(form, error.message || 'Erro ao processar solicitação. Tente novamente.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar link de recuperação';
                }
            });

            function showMessage(formEl, message, type) {
                removeMessages(formEl);
                const div = document.createElement('div');
                div.className = 'recovery-message';
                if (type === 'success') {
                    div.style.cssText = 'background-color: var(--pastel-blue, #d0e8ff); color: var(--intense-blue, #0057b7); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center;';
                } else {
                    div.style.cssText = 'background-color: var(--pastel-pink, #ffd6e0); color: var(--intense-pink, #c0003c); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; text-align: center;';
                }
                div.textContent = message;
                formEl.insertBefore(div, formEl.firstChild);
            }

            function removeMessages(formEl) {
                const existing = formEl.querySelector('.recovery-message');
                if (existing) existing.remove();
            }
        });
    </script>
</body>
</html>
