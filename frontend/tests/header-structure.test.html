<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Structure Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background-color: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background-color: #fef1f0;
        }
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-weight: bold;
        }
        .error-details {
            color: #d32f2f;
            font-family: monospace;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Header Structure - Unit Tests</h1>
    <div id="test-results"></div>
    <div id="test-summary" class="test-summary"></div>

    <!-- Hidden test container -->
    <div id="test-container" style="display: none;"></div>

    <script>
        // Simple test framework
        class TestRunner {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            describe(suiteName, testFn) {
                const suite = {
                    name: suiteName,
                    tests: []
                };
                this.currentSuite = suite;
                testFn();
                this.tests.push(suite);
                this.currentSuite = null;
            }

            it(testName, testFn) {
                if (!this.currentSuite) {
                    throw new Error('Test must be inside a describe block');
                }
                this.currentSuite.tests.push({
                    name: testName,
                    fn: testFn
                });
            }

            async run() {
                const resultsContainer = document.getElementById('test-results');
                let totalTests = 0;
                let passedTests = 0;

                for (const suite of this.tests) {
                    const suiteDiv = document.createElement('div');
                    suiteDiv.className = 'test-suite';
                    suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;

                    for (const test of suite.tests) {
                        totalTests++;
                        const testDiv = document.createElement('div');
                        testDiv.className = 'test-case';

                        try {
                            await test.fn();
                            testDiv.classList.add('pass');
                            testDiv.innerHTML = `✓ ${test.name}`;
                            passedTests++;
                        } catch (error) {
                            testDiv.classList.add('fail');
                            testDiv.innerHTML = `✗ ${test.name}<div class="error-details">${error.message}</div>`;
                        }

                        suiteDiv.appendChild(testDiv);
                    }

                    resultsContainer.appendChild(suiteDiv);
                }

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    Tests: ${passedTests}/${totalTests} passed
                    ${passedTests === totalTests ? '✓ All tests passed!' : '✗ Some tests failed'}
                `;
                summaryDiv.style.color = passedTests === totalTests ? '#4CAF50' : '#f44336';
            }
        }

        // Assertion helpers
        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy value but got ${actual}`);
                    }
                },
                toBeFalsy() {
                    if (actual) {
                        throw new Error(`Expected falsy value but got ${actual}`);
                    }
                },
                toContain(expected) {
                    if (!actual.includes(expected)) {
                        throw new Error(`Expected "${actual}" to contain "${expected}"`);
                    }
                },
                toBeGreaterThan(expected) {
                    if (actual <= expected) {
                        throw new Error(`Expected ${actual} to be greater than ${expected}`);
                    }
                },
                toHaveLength(expected) {
                    if (actual.length !== expected) {
                        throw new Error(`Expected length ${expected} but got ${actual.length}`);
                    }
                },
                toBeNull() {
                    if (actual !== null) {
                        throw new Error(`Expected null but got ${actual}`);
                    }
                },
                not: {
                    toBeNull() {
                        if (actual === null) {
                            throw new Error(`Expected not null but got null`);
                        }
                    }
                }
            };
        }

        // Helper function to create header HTML
        function createHeaderHTML() {
            return `
                <header class="main-header">
                    <div class="header-container">
                        <!-- Logo -->
                        <a href="/" class="logo">FicVerse</a>
                        
                        <!-- Search Bar -->
                        <div class="search-bar">
                            <input type="text" class="search-input" placeholder="Busca em FoVene..." aria-label="Buscar fanfics">
                            <button class="search-icon" aria-label="Buscar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Header Actions -->
                        <div class="header-actions">
                            <!-- Categories Button -->
                            <button class="categories-btn" aria-label="Menu de categorias" aria-expanded="false">
                                <span>Categorias</span>
                                <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                            
                            <!-- Notification Bell -->
                            <button class="notification-bell" aria-label="Notificações">
                                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg>
                                <span class="notification-badge">0</span>
                            </button>
                            
                            <!-- Auth Area -->
                            <div class="auth-area">
                                <!-- Not Authenticated State -->
                                <div class="auth-buttons">
                                    <a href="login.html" class="btn-entrar">Entrar</a>
                                    <a href="register.html" class="btn-cadastrar">Cadastrar</a>
                                </div>
                                
                                <!-- Authenticated State -->
                                <div class="user-menu" style="display: none;">
                                    <button class="user-avatar-btn" aria-label="Menu do usuário" aria-expanded="false">
                                        <img src="" alt="Avatar do usuário" class="user-avatar">
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;
        }

        // Test Suite
        const runner = new TestRunner();

        runner.describe('Header Structure - Main Elements Presence (Requirements 1.1, 1.2, 1.3, 1.4)', () => {
            runner.it('should have a main header element', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const header = container.querySelector('.main-header');
                expect(header).not.toBeNull();
            });

            runner.it('should have a header container', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerContainer = container.querySelector('.header-container');
                expect(headerContainer).not.toBeNull();
            });

            runner.it('should have a logo element (Requirement 1.1)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const logo = container.querySelector('.logo');
                expect(logo).not.toBeNull();
                expect(logo.textContent).toContain('FicVerse');
            });

            runner.it('should have a search bar element (Requirement 1.2)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchBar = container.querySelector('.search-bar');
                expect(searchBar).not.toBeNull();
            });

            runner.it('should have a search input field (Requirement 1.2)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchInput = container.querySelector('.search-input');
                expect(searchInput).not.toBeNull();
                expect(searchInput.placeholder).toContain('Busca');
            });

            runner.it('should have a search button (Requirement 1.2)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchButton = container.querySelector('.search-icon');
                expect(searchButton).not.toBeNull();
            });

            runner.it('should have header actions container', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerActions = container.querySelector('.header-actions');
                expect(headerActions).not.toBeNull();
            });

            runner.it('should have a categories button (Requirement 1.3)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const categoriesBtn = container.querySelector('.categories-btn');
                expect(categoriesBtn).not.toBeNull();
                expect(categoriesBtn.textContent).toContain('Categorias');
            });

            runner.it('should have a notification bell (Requirement 1.4)', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const notificationBell = container.querySelector('.notification-bell');
                expect(notificationBell).not.toBeNull();
            });

            runner.it('should have a notification badge', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const notificationBadge = container.querySelector('.notification-badge');
                expect(notificationBadge).not.toBeNull();
            });

            runner.it('should have an auth area', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const authArea = container.querySelector('.auth-area');
                expect(authArea).not.toBeNull();
            });

            runner.it('should have auth buttons for non-authenticated state', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const authButtons = container.querySelector('.auth-buttons');
                expect(authButtons).not.toBeNull();
            });

            runner.it('should have login button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const loginBtn = container.querySelector('.btn-entrar');
                expect(loginBtn).not.toBeNull();
                expect(loginBtn.textContent).toContain('Entrar');
                expect(loginBtn.href).toContain('login.html');
            });

            runner.it('should have register button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const registerBtn = container.querySelector('.btn-cadastrar');
                expect(registerBtn).not.toBeNull();
                expect(registerBtn.textContent).toContain('Cadastrar');
                expect(registerBtn.href).toContain('register.html');
            });

            runner.it('should have user menu for authenticated state', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userMenu = container.querySelector('.user-menu');
                expect(userMenu).not.toBeNull();
            });

            runner.it('should have user avatar button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userAvatarBtn = container.querySelector('.user-avatar-btn');
                expect(userAvatarBtn).not.toBeNull();
            });

            runner.it('should have user avatar image', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userAvatar = container.querySelector('.user-avatar');
                expect(userAvatar).not.toBeNull();
                expect(userAvatar.alt).toContain('Avatar');
            });
        });

        runner.describe('Header Structure - Element Order (Requirements 1.1, 1.2, 1.3, 1.4)', () => {
            runner.it('should have logo as the first element in header container', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerContainer = container.querySelector('.header-container');
                const firstChild = headerContainer.children[0];
                
                expect(firstChild.classList.contains('logo')).toBeTruthy();
            });

            runner.it('should have search bar as the second element in header container', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerContainer = container.querySelector('.header-container');
                const secondChild = headerContainer.children[1];
                
                expect(secondChild.classList.contains('search-bar')).toBeTruthy();
            });

            runner.it('should have header actions as the third element in header container', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerContainer = container.querySelector('.header-container');
                const thirdChild = headerContainer.children[2];
                
                expect(thirdChild.classList.contains('header-actions')).toBeTruthy();
            });

            runner.it('should have categories button before notification bell in header actions', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerActions = container.querySelector('.header-actions');
                const categoriesBtn = headerActions.querySelector('.categories-btn');
                const notificationBell = headerActions.querySelector('.notification-bell');
                
                const categoriesIndex = Array.from(headerActions.children).indexOf(categoriesBtn);
                const notificationIndex = Array.from(headerActions.children).indexOf(notificationBell);
                
                expect(categoriesIndex).toBeGreaterThan(-1);
                expect(notificationIndex).toBeGreaterThan(-1);
                expect(categoriesIndex < notificationIndex).toBeTruthy();
            });

            runner.it('should have notification bell before auth area in header actions', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerActions = container.querySelector('.header-actions');
                const notificationBell = headerActions.querySelector('.notification-bell');
                const authArea = headerActions.querySelector('.auth-area');
                
                const notificationIndex = Array.from(headerActions.children).indexOf(notificationBell);
                const authIndex = Array.from(headerActions.children).indexOf(authArea);
                
                expect(notificationIndex).toBeGreaterThan(-1);
                expect(authIndex).toBeGreaterThan(-1);
                expect(notificationIndex < authIndex).toBeTruthy();
            });

            runner.it('should have auth area as the last element in header actions', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerActions = container.querySelector('.header-actions');
                const lastChild = headerActions.children[headerActions.children.length - 1];
                
                expect(lastChild.classList.contains('auth-area')).toBeTruthy();
            });

            runner.it('should have correct order: Logo → Search Bar → Categories → Notification → Auth', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const headerContainer = container.querySelector('.header-container');
                const logo = headerContainer.querySelector('.logo');
                const searchBar = headerContainer.querySelector('.search-bar');
                const categoriesBtn = headerContainer.querySelector('.categories-btn');
                const notificationBell = headerContainer.querySelector('.notification-bell');
                const authArea = headerContainer.querySelector('.auth-area');
                
                // Get positions
                const logoPos = logo.getBoundingClientRect();
                const searchBarPos = searchBar.getBoundingClientRect();
                const categoriesPos = categoriesBtn.getBoundingClientRect();
                const notificationPos = notificationBell.getBoundingClientRect();
                const authPos = authArea.getBoundingClientRect();
                
                // Verify all elements exist
                expect(logo).not.toBeNull();
                expect(searchBar).not.toBeNull();
                expect(categoriesBtn).not.toBeNull();
                expect(notificationBell).not.toBeNull();
                expect(authArea).not.toBeNull();
            });
        });

        runner.describe('Header Structure - Accessibility Attributes', () => {
            runner.it('should have aria-label on search input', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchInput = container.querySelector('.search-input');
                expect(searchInput.getAttribute('aria-label')).not.toBeNull();
            });

            runner.it('should have aria-label on search button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchButton = container.querySelector('.search-icon');
                expect(searchButton.getAttribute('aria-label')).not.toBeNull();
            });

            runner.it('should have aria-label on categories button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const categoriesBtn = container.querySelector('.categories-btn');
                expect(categoriesBtn.getAttribute('aria-label')).not.toBeNull();
            });

            runner.it('should have aria-expanded on categories button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const categoriesBtn = container.querySelector('.categories-btn');
                expect(categoriesBtn.getAttribute('aria-expanded')).not.toBeNull();
            });

            runner.it('should have aria-label on notification bell', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const notificationBell = container.querySelector('.notification-bell');
                expect(notificationBell.getAttribute('aria-label')).not.toBeNull();
            });

            runner.it('should have aria-label on user avatar button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userAvatarBtn = container.querySelector('.user-avatar-btn');
                expect(userAvatarBtn.getAttribute('aria-label')).not.toBeNull();
            });

            runner.it('should have aria-expanded on user avatar button', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userAvatarBtn = container.querySelector('.user-avatar-btn');
                expect(userAvatarBtn.getAttribute('aria-expanded')).not.toBeNull();
            });

            runner.it('should have alt text on user avatar image', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const userAvatar = container.querySelector('.user-avatar');
                expect(userAvatar.getAttribute('alt')).not.toBeNull();
            });
        });

        runner.describe('Header Structure - Semantic HTML', () => {
            runner.it('should use header tag for main header', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const header = container.querySelector('header');
                expect(header).not.toBeNull();
            });

            runner.it('should use anchor tag for logo', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const logo = container.querySelector('.logo');
                expect(logo.tagName.toLowerCase()).toBe('a');
            });

            runner.it('should use input tag for search field', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchInput = container.querySelector('.search-input');
                expect(searchInput.tagName.toLowerCase()).toBe('input');
            });

            runner.it('should use button tags for interactive elements', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const searchButton = container.querySelector('.search-icon');
                const categoriesBtn = container.querySelector('.categories-btn');
                const notificationBell = container.querySelector('.notification-bell');
                const userAvatarBtn = container.querySelector('.user-avatar-btn');
                
                expect(searchButton.tagName.toLowerCase()).toBe('button');
                expect(categoriesBtn.tagName.toLowerCase()).toBe('button');
                expect(notificationBell.tagName.toLowerCase()).toBe('button');
                expect(userAvatarBtn.tagName.toLowerCase()).toBe('button');
            });

            runner.it('should use anchor tags for navigation links', () => {
                const container = document.getElementById('test-container');
                container.innerHTML = createHeaderHTML();
                
                const loginBtn = container.querySelector('.btn-entrar');
                const registerBtn = container.querySelector('.btn-cadastrar');
                
                expect(loginBtn.tagName.toLowerCase()).toBe('a');
                expect(registerBtn.tagName.toLowerCase()).toBe('a');
            });
        });

        // Run all tests
        window.addEventListener('DOMContentLoaded', () => {
            runner.run();
        });
    </script>
</body>
</html>
