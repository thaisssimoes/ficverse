<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Forms Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background-color: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background-color: #fef1f0;
        }
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-weight: bold;
        }
        .error-details {
            color: #d32f2f;
            font-family: monospace;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Authentication Forms - Unit Tests</h1>
    <div id="test-results"></div>
    <div id="test-summary" class="test-summary"></div>

    <!-- Hidden test container -->
    <div id="test-container" style="display: none;"></div>

    <script>
        // Simple test framework
        class TestRunner {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            describe(suiteName, testFn) {
                const suite = {
                    name: suiteName,
                    tests: []
                };
                this.currentSuite = suite;
                testFn();
                this.tests.push(suite);
                this.currentSuite = null;
            }

            it(testName, testFn) {
                if (!this.currentSuite) {
                    throw new Error('Test must be inside a describe block');
                }
                this.currentSuite.tests.push({
                    name: testName,
                    fn: testFn
                });
            }

            async run() {
                const resultsContainer = document.getElementById('test-results');
                let totalTests = 0;
                let passedTests = 0;

                for (const suite of this.tests) {
                    const suiteDiv = document.createElement('div');
                    suiteDiv.className = 'test-suite';
                    suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;

                    for (const test of suite.tests) {
                        totalTests++;
                        const testDiv = document.createElement('div');
                        testDiv.className = 'test-case';

                        try {
                            await test.fn();
                            testDiv.classList.add('pass');
                            testDiv.innerHTML = `✓ ${test.name}`;
                            passedTests++;
                        } catch (error) {
                            testDiv.classList.add('fail');
                            testDiv.innerHTML = `✗ ${test.name}<div class="error-details">${error.message}</div>`;
                        }

                        suiteDiv.appendChild(testDiv);
                    }

                    resultsContainer.appendChild(suiteDiv);
                }

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    Tests: ${passedTests}/${totalTests} passed
                    ${passedTests === totalTests ? '✓ All tests passed!' : '✗ Some tests failed'}
                `;
                summaryDiv.style.color = passedTests === totalTests ? '#4CAF50' : '#f44336';
            }
        }

        // Assertion helpers
        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy value but got ${actual}`);
                    }
                },
                toBeFalsy() {
                    if (actual) {
                        throw new Error(`Expected falsy value but got ${actual}`);
                    }
                },
                toContain(expected) {
                    if (!actual.includes(expected)) {
                        throw new Error(`Expected "${actual}" to contain "${expected}"`);
                    }
                },
                toBeGreaterThan(expected) {
                    if (actual <= expected) {
                        throw new Error(`Expected ${actual} to be greater than ${expected}`);
                    }
                },
                toHaveLength(expected) {
                    if (actual.length !== expected) {
                        throw new Error(`Expected length ${expected} but got ${actual.length}`);
                    }
                }
            };
        }

        // Mock API Client
        class MockAPIClient {
            constructor() {
                this.token = null;
                this.shouldFail = false;
                this.failureMessage = '';
            }

            async login(email, password) {
                if (this.shouldFail) {
                    throw new Error(this.failureMessage || 'Invalid credentials');
                }
                this.token = 'mock-token-12345';
                return { token: this.token, user: { email } };
            }

            async register(username, email, password) {
                if (this.shouldFail) {
                    throw new Error(this.failureMessage || 'Registration failed');
                }
                this.token = 'mock-token-67890';
                return { token: this.token, user: { username, email } };
            }

            setToken(token) {
                this.token = token;
            }

            clearToken() {
                this.token = null;
            }
        }

        // AuthUI class (simplified for testing)
        class AuthUI {
            constructor(apiClient) {
                this.api = apiClient;
            }

            validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            validatePassword(password) {
                return password.length >= 6;
            }

            validateUsername(username) {
                return username.length >= 3;
            }

            showFieldError(inputElement, message) {
                inputElement.classList.add('error');
                const errorSpan = document.createElement('span');
                errorSpan.className = 'field-error';
                errorSpan.textContent = message;
                inputElement.parentElement.appendChild(errorSpan);
            }

            clearFieldError(inputElement) {
                inputElement.classList.remove('error');
                const errorSpan = inputElement.parentElement.querySelector('.field-error');
                if (errorSpan) {
                    errorSpan.remove();
                }
            }

            showError(message, formElement) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                formElement.insertBefore(errorDiv, formElement.firstChild);
            }
        }

        // Helper functions
        function createLoginForm() {
            const container = document.getElementById('test-container');
            container.innerHTML = `
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
            `;
            return document.getElementById('login-form');
        }

        function createRegisterForm() {
            const container = document.getElementById('test-container');
            container.innerHTML = `
                <form id="register-form">
                    <div class="form-group">
                        <label for="username">Nome de Usuário</label>
                        <input type="text" id="username" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </form>
            `;
            return document.getElementById('register-form');
        }

        // Test Suite
        const runner = new TestRunner();

        runner.describe('Form Validation - Email', () => {
            runner.it('should validate correct email format', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateEmail('user@example.com')).toBeTruthy();
                expect(authUI.validateEmail('test.user@domain.co.uk')).toBeTruthy();
                expect(authUI.validateEmail('name+tag@example.org')).toBeTruthy();
            });

            runner.it('should reject invalid email format', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateEmail('invalid')).toBeFalsy();
                expect(authUI.validateEmail('invalid@')).toBeFalsy();
                expect(authUI.validateEmail('@example.com')).toBeFalsy();
                expect(authUI.validateEmail('user@')).toBeFalsy();
                expect(authUI.validateEmail('user @example.com')).toBeFalsy();
            });

            runner.it('should reject empty email', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateEmail('')).toBeFalsy();
                expect(authUI.validateEmail('   ')).toBeFalsy();
            });
        });

        runner.describe('Form Validation - Password', () => {
            runner.it('should validate password with minimum length', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validatePassword('123456')).toBeTruthy();
                expect(authUI.validatePassword('password123')).toBeTruthy();
                expect(authUI.validatePassword('verylongpassword')).toBeTruthy();
            });

            runner.it('should reject password shorter than 6 characters', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validatePassword('12345')).toBeFalsy();
                expect(authUI.validatePassword('abc')).toBeFalsy();
                expect(authUI.validatePassword('1')).toBeFalsy();
            });

            runner.it('should reject empty password', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validatePassword('')).toBeFalsy();
            });
        });

        runner.describe('Form Validation - Username', () => {
            runner.it('should validate username with minimum length', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateUsername('abc')).toBeTruthy();
                expect(authUI.validateUsername('user123')).toBeTruthy();
                expect(authUI.validateUsername('verylongusername')).toBeTruthy();
            });

            runner.it('should reject username shorter than 3 characters', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateUsername('ab')).toBeFalsy();
                expect(authUI.validateUsername('a')).toBeFalsy();
            });

            runner.it('should reject empty username', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateUsername('')).toBeFalsy();
            });
        });

        runner.describe('Login Form - Field Validation', () => {
            runner.it('should show error for invalid email on blur', () => {
                createLoginForm();
                const authUI = new AuthUI(new MockAPIClient());
                const emailInput = document.getElementById('email');
                
                emailInput.value = 'invalid-email';
                
                if (!authUI.validateEmail(emailInput.value)) {
                    authUI.showFieldError(emailInput, 'Email inválido');
                }
                
                expect(emailInput.classList.contains('error')).toBeTruthy();
                expect(emailInput.parentElement.querySelector('.field-error')).toBeTruthy();
            });

            runner.it('should clear error when input is corrected', () => {
                createLoginForm();
                const authUI = new AuthUI(new MockAPIClient());
                const emailInput = document.getElementById('email');
                
                // First show error
                authUI.showFieldError(emailInput, 'Email inválido');
                expect(emailInput.classList.contains('error')).toBeTruthy();
                
                // Then clear it
                authUI.clearFieldError(emailInput);
                expect(emailInput.classList.contains('error')).toBeFalsy();
                expect(emailInput.parentElement.querySelector('.field-error')).toBeFalsy();
            });

            runner.it('should validate all required fields', () => {
                createLoginForm();
                const authUI = new AuthUI(new MockAPIClient());
                const form = document.getElementById('login-form');
                const emailInput = form.querySelector('#email');
                const passwordInput = form.querySelector('#password');
                
                // Test empty fields
                let hasError = false;
                
                if (!emailInput.value) {
                    authUI.showFieldError(emailInput, 'Email é obrigatório');
                    hasError = true;
                }
                
                if (!passwordInput.value) {
                    authUI.showFieldError(passwordInput, 'Senha é obrigatória');
                    hasError = true;
                }
                
                expect(hasError).toBeTruthy();
                expect(emailInput.classList.contains('error')).toBeTruthy();
                expect(passwordInput.classList.contains('error')).toBeTruthy();
            });
        });

        runner.describe('Registration Form - Field Validation', () => {
            runner.it('should validate all required fields', () => {
                createRegisterForm();
                const authUI = new AuthUI(new MockAPIClient());
                const form = document.getElementById('register-form');
                const usernameInput = form.querySelector('#username');
                const emailInput = form.querySelector('#email');
                const passwordInput = form.querySelector('#password');
                
                // Test empty fields
                let hasError = false;
                
                if (!usernameInput.value) {
                    authUI.showFieldError(usernameInput, 'Nome de usuário é obrigatório');
                    hasError = true;
                }
                
                if (!emailInput.value) {
                    authUI.showFieldError(emailInput, 'Email é obrigatório');
                    hasError = true;
                }
                
                if (!passwordInput.value) {
                    authUI.showFieldError(passwordInput, 'Senha é obrigatória');
                    hasError = true;
                }
                
                expect(hasError).toBeTruthy();
                expect(usernameInput.classList.contains('error')).toBeTruthy();
                expect(emailInput.classList.contains('error')).toBeTruthy();
                expect(passwordInput.classList.contains('error')).toBeTruthy();
            });

            runner.it('should show error for short username', () => {
                createRegisterForm();
                const authUI = new AuthUI(new MockAPIClient());
                const usernameInput = document.getElementById('username');
                
                usernameInput.value = 'ab';
                
                if (!authUI.validateUsername(usernameInput.value)) {
                    authUI.showFieldError(usernameInput, 'Nome de usuário deve ter pelo menos 3 caracteres');
                }
                
                expect(usernameInput.classList.contains('error')).toBeTruthy();
            });

            runner.it('should show error for short password', () => {
                createRegisterForm();
                const authUI = new AuthUI(new MockAPIClient());
                const passwordInput = document.getElementById('password');
                
                passwordInput.value = '12345';
                
                if (!authUI.validatePassword(passwordInput.value)) {
                    authUI.showFieldError(passwordInput, 'Senha deve ter pelo menos 6 caracteres');
                }
                
                expect(passwordInput.classList.contains('error')).toBeTruthy();
            });
        });

        runner.describe('Login Form - Error Display', () => {
            runner.it('should display error message on login failure', () => {
                createLoginForm();
                const mockAPI = new MockAPIClient();
                mockAPI.shouldFail = true;
                mockAPI.failureMessage = 'Invalid credentials';
                
                const authUI = new AuthUI(mockAPI);
                const form = document.getElementById('login-form');
                
                authUI.showError('Erro ao fazer login. Verifique suas credenciais.', form);
                
                const errorMessage = form.querySelector('.error-message');
                expect(errorMessage).toBeTruthy();
                expect(errorMessage.textContent).toContain('Erro ao fazer login');
            });

            runner.it('should display specific error for invalid credentials', () => {
                createLoginForm();
                const mockAPI = new MockAPIClient();
                mockAPI.shouldFail = true;
                
                const authUI = new AuthUI(mockAPI);
                const form = document.getElementById('login-form');
                
                authUI.showError('Credenciais inválidas', form);
                
                const errorMessage = form.querySelector('.error-message');
                expect(errorMessage.textContent).toBe('Credenciais inválidas');
            });
        });

        runner.describe('Registration Form - Error Display', () => {
            runner.it('should display error message on registration failure', () => {
                createRegisterForm();
                const mockAPI = new MockAPIClient();
                mockAPI.shouldFail = true;
                
                const authUI = new AuthUI(mockAPI);
                const form = document.getElementById('register-form');
                
                authUI.showError('Erro ao criar conta. Tente novamente.', form);
                
                const errorMessage = form.querySelector('.error-message');
                expect(errorMessage).toBeTruthy();
                expect(errorMessage.textContent).toContain('Erro ao criar conta');
            });

            runner.it('should display specific error for duplicate email', () => {
                createRegisterForm();
                const authUI = new AuthUI(new MockAPIClient());
                const form = document.getElementById('register-form');
                
                authUI.showError('Este email já está em uso.', form);
                
                const errorMessage = form.querySelector('.error-message');
                expect(errorMessage.textContent).toBe('Este email já está em uso.');
            });

            runner.it('should display specific error for duplicate username', () => {
                createRegisterForm();
                const authUI = new AuthUI(new MockAPIClient());
                const form = document.getElementById('register-form');
                
                authUI.showError('Este nome de usuário já está em uso.', form);
                
                const errorMessage = form.querySelector('.error-message');
                expect(errorMessage.textContent).toBe('Este nome de usuário já está em uso.');
            });
        });

        runner.describe('Successful Login Flow', () => {
            runner.it('should call API with correct credentials', async () => {
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                
                const result = await mockAPI.login('user@example.com', 'password123');
                
                expect(result.token).toBeTruthy();
                expect(result.user.email).toBe('user@example.com');
            });

            runner.it('should store token after successful login', async () => {
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                
                await mockAPI.login('user@example.com', 'password123');
                
                expect(mockAPI.token).toBeTruthy();
                expect(mockAPI.token).toBe('mock-token-12345');
            });

            runner.it('should accept valid login credentials', async () => {
                createLoginForm();
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                const form = document.getElementById('login-form');
                
                const emailInput = form.querySelector('#email');
                const passwordInput = form.querySelector('#password');
                
                emailInput.value = 'user@example.com';
                passwordInput.value = 'password123';
                
                // Validate
                let hasError = false;
                
                if (!authUI.validateEmail(emailInput.value)) {
                    hasError = true;
                }
                
                if (!authUI.validatePassword(passwordInput.value)) {
                    hasError = true;
                }
                
                expect(hasError).toBeFalsy();
                
                // Attempt login
                const result = await mockAPI.login(emailInput.value, passwordInput.value);
                expect(result.token).toBeTruthy();
            });
        });

        runner.describe('Successful Registration Flow', () => {
            runner.it('should call API with correct registration data', async () => {
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                
                const result = await mockAPI.register('testuser', 'user@example.com', 'password123');
                
                expect(result.token).toBeTruthy();
                expect(result.user.username).toBe('testuser');
                expect(result.user.email).toBe('user@example.com');
            });

            runner.it('should store token after successful registration', async () => {
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                
                await mockAPI.register('testuser', 'user@example.com', 'password123');
                
                expect(mockAPI.token).toBeTruthy();
                expect(mockAPI.token).toBe('mock-token-67890');
            });

            runner.it('should accept valid registration data', async () => {
                createRegisterForm();
                const mockAPI = new MockAPIClient();
                const authUI = new AuthUI(mockAPI);
                const form = document.getElementById('register-form');
                
                const usernameInput = form.querySelector('#username');
                const emailInput = form.querySelector('#email');
                const passwordInput = form.querySelector('#password');
                
                usernameInput.value = 'newuser';
                emailInput.value = 'newuser@example.com';
                passwordInput.value = 'password123';
                
                // Validate
                let hasError = false;
                
                if (!authUI.validateUsername(usernameInput.value)) {
                    hasError = true;
                }
                
                if (!authUI.validateEmail(emailInput.value)) {
                    hasError = true;
                }
                
                if (!authUI.validatePassword(passwordInput.value)) {
                    hasError = true;
                }
                
                expect(hasError).toBeFalsy();
                
                // Attempt registration
                const result = await mockAPI.register(
                    usernameInput.value,
                    emailInput.value,
                    passwordInput.value
                );
                expect(result.token).toBeTruthy();
            });
        });

        runner.describe('Edge Cases', () => {
            runner.it('should trim whitespace from email', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                const email = '  user@example.com  ';
                const trimmed = email.trim();
                
                expect(authUI.validateEmail(trimmed)).toBeTruthy();
            });

            runner.it('should handle special characters in username', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validateUsername('user_123')).toBeTruthy();
                expect(authUI.validateUsername('user-name')).toBeTruthy();
                expect(authUI.validateUsername('user.name')).toBeTruthy();
            });

            runner.it('should handle long passwords', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                const longPassword = 'a'.repeat(100);
                expect(authUI.validatePassword(longPassword)).toBeTruthy();
            });

            runner.it('should handle passwords with special characters', () => {
                const authUI = new AuthUI(new MockAPIClient());
                
                expect(authUI.validatePassword('P@ssw0rd!')).toBeTruthy();
                expect(authUI.validatePassword('pass#word$123')).toBeTruthy();
            });
        });

        // Run all tests
        window.addEventListener('DOMContentLoaded', () => {
            runner.run();
        });
    </script>
</body>
</html>
