<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanfic Detail Page Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background-color: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background-color: #fef1f0;
        }
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-weight: bold;
        }
        .error-details {
            color: #d32f2f;
            font-family: monospace;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Fanfic Detail Page - Unit Tests</h1>
    <div id="test-results"></div>
    <div id="test-summary" class="test-summary"></div>

    <!-- Hidden test container -->
    <div id="test-container" style="display: none;"></div>

    <script>
        // Simple test framework
        class TestRunner {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            describe(suiteName, testFn) {
                const suite = {
                    name: suiteName,
                    tests: []
                };
                this.currentSuite = suite;
                testFn();
                this.tests.push(suite);
                this.currentSuite = null;
            }

            it(testName, testFn) {
                if (!this.currentSuite) {
                    throw new Error('Test must be inside a describe block');
                }
                this.currentSuite.tests.push({
                    name: testName,
                    fn: testFn
                });
            }

            async run() {
                const resultsContainer = document.getElementById('test-results');
                let totalTests = 0;
                let passedTests = 0;

                for (const suite of this.tests) {
                    const suiteDiv = document.createElement('div');
                    suiteDiv.className = 'test-suite';
                    suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;

                    for (const test of suite.tests) {
                        totalTests++;
                        const testDiv = document.createElement('div');
                        testDiv.className = 'test-case';

                        try {
                            await test.fn();
                            testDiv.classList.add('pass');
                            testDiv.innerHTML = `✓ ${test.name}`;
                            passedTests++;
                        } catch (error) {
                            testDiv.classList.add('fail');
                            testDiv.innerHTML = `✗ ${test.name}<div class="error-details">${error.message}</div>`;
                        }

                        suiteDiv.appendChild(testDiv);
                    }

                    resultsContainer.appendChild(suiteDiv);
                }

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    Tests: ${passedTests}/${totalTests} passed
                    ${passedTests === totalTests ? '✓ All tests passed!' : '✗ Some tests failed'}
                `;
                summaryDiv.style.color = passedTests === totalTests ? '#4CAF50' : '#f44336';
            }
        }

        // Assertion helpers
        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy value but got ${actual}`);
                    }
                },
                toBeFalsy() {
                    if (actual) {
                        throw new Error(`Expected falsy value but got ${actual}`);
                    }
                },
                toContain(expected) {
                    if (!actual.includes(expected)) {
                        throw new Error(`Expected "${actual}" to contain "${expected}"`);
                    }
                },
                toBeGreaterThan(expected) {
                    if (actual <= expected) {
                        throw new Error(`Expected ${actual} to be greater than ${expected}`);
                    }
                }
            };
        }

        // Mock API for testing
        const mockApi = {
            getFanfic: async (id) => ({
                id: parseInt(id),
                title: 'Test Fanfic',
                synopsis: 'This is a test synopsis',
                disclaimer: 'Test disclaimer content',
                category: 'Romance',
                cover_url: 'https://example.com/cover.jpg',
                interactive_mode: true,
                author_id: 1
            }),
            getChapters: async (fanficId) => [
                { id: 1, fanfic_id: fanficId, title: 'Chapter One', content: 'Content 1', order: 1 },
                { id: 2, fanfic_id: fanficId, title: 'Chapter Two', content: 'Content 2', order: 2 },
                { id: 3, fanfic_id: fanficId, title: 'Chapter Three', content: 'Content 3', order: 3 }
            ],
            getQuestions: async (fanficId) => [
                { id: 1, fanfic_id: fanficId, question_text: 'What is your name?', placeholder: '{{name}}' },
                { id: 2, fanfic_id: fanficId, question_text: 'What is your favorite color?', placeholder: '{{color}}' }
            ]
        };

        // Test Suite
        const runner = new TestRunner();

        runner.describe('Fanfic Detail Page - Display Tests', () => {
            runner.it('should display all fanfic elements (cover, title, synopsis, category)', async () => {
                const fanfic = await mockApi.getFanfic(1);
                
                // Simulate rendering
                const container = document.getElementById('test-container');
                container.innerHTML = `
                    <img id="test-cover" src="${fanfic.cover_url}" alt="Cover">
                    <h1 id="test-title">${fanfic.title}</h1>
                    <p id="test-category">${fanfic.category}</p>
                    <div id="test-synopsis">${fanfic.synopsis}</div>
                `;

                const cover = document.getElementById('test-cover');
                const title = document.getElementById('test-title');
                const category = document.getElementById('test-category');
                const synopsis = document.getElementById('test-synopsis');

                expect(cover.src).toContain(fanfic.cover_url);
                expect(title.textContent).toBe(fanfic.title);
                expect(category.textContent).toBe(fanfic.category);
                expect(synopsis.textContent).toBe(fanfic.synopsis);
            });

            runner.it('should display disclaimer when present', async () => {
                const fanfic = await mockApi.getFanfic(1);
                
                expect(fanfic.disclaimer).toBeTruthy();
                expect(fanfic.disclaimer).toBe('Test disclaimer content');
            });

            runner.it('should display chapters list with titles and numbers', async () => {
                const chapters = await mockApi.getChapters(1);
                
                expect(chapters.length).toBe(3);
                expect(chapters[0].title).toBe('Chapter One');
                expect(chapters[0].order).toBe(1);
                expect(chapters[1].title).toBe('Chapter Two');
                expect(chapters[1].order).toBe(2);
                expect(chapters[2].title).toBe('Chapter Three');
                expect(chapters[2].order).toBe(3);
            });
        });

        runner.describe('Interactive Mode Options Tests', () => {
            runner.it('should show interactive mode options when interactive_mode is true', async () => {
                const fanfic = await mockApi.getFanfic(1);
                const questions = await mockApi.getQuestions(1);
                
                expect(fanfic.interactive_mode).toBeTruthy();
                expect(questions.length).toBeGreaterThan(0);
            });

            runner.it('should not show interactive mode options when no questions exist', async () => {
                // Mock fanfic without questions
                const mockApiNoQuestions = {
                    getFanfic: async (id) => ({
                        id: parseInt(id),
                        title: 'Test Fanfic',
                        interactive_mode: false
                    }),
                    getQuestions: async (fanficId) => []
                };

                const fanfic = await mockApiNoQuestions.getFanfic(1);
                const questions = await mockApiNoQuestions.getQuestions(1);
                
                expect(questions.length).toBe(0);
            });
        });

        runner.describe('Chapter List Ordering Tests', () => {
            runner.it('should display chapters in correct sequential order', async () => {
                const chapters = await mockApi.getChapters(1);
                
                // Verify chapters are in order
                for (let i = 0; i < chapters.length - 1; i++) {
                    expect(chapters[i].order).toBe(i + 1);
                    expect(chapters[i + 1].order).toBeGreaterThan(chapters[i].order);
                }
            });

            runner.it('should maintain chapter ordering even if fetched out of order', async () => {
                // Simulate chapters fetched in wrong order
                const unorderedChapters = [
                    { id: 3, title: 'Chapter Three', order: 3 },
                    { id: 1, title: 'Chapter One', order: 1 },
                    { id: 2, title: 'Chapter Two', order: 2 }
                ];

                // Sort by order (simulating what the display function does)
                const sortedChapters = [...unorderedChapters].sort((a, b) => a.order - b.order);

                expect(sortedChapters[0].order).toBe(1);
                expect(sortedChapters[1].order).toBe(2);
                expect(sortedChapters[2].order).toBe(3);
                expect(sortedChapters[0].title).toBe('Chapter One');
            });

            runner.it('should handle empty chapter list gracefully', async () => {
                const emptyChapters = [];
                
                expect(emptyChapters.length).toBe(0);
                // In the actual implementation, this should show "Nenhum capítulo disponível ainda."
            });
        });

        runner.describe('Data Integrity Tests', () => {
            runner.it('should have all required fanfic fields', async () => {
                const fanfic = await mockApi.getFanfic(1);
                
                expect(fanfic.id).toBeTruthy();
                expect(fanfic.title).toBeTruthy();
                expect(fanfic.synopsis).toBeTruthy();
                expect(fanfic.category).toBeTruthy();
                expect(fanfic.cover_url).toBeTruthy();
            });

            runner.it('should have all required chapter fields', async () => {
                const chapters = await mockApi.getChapters(1);
                
                chapters.forEach(chapter => {
                    expect(chapter.id).toBeTruthy();
                    expect(chapter.title).toBeTruthy();
                    expect(chapter.order).toBeTruthy();
                    expect(chapter.fanfic_id).toBeTruthy();
                });
            });
        });

        // Run all tests
        window.addEventListener('DOMContentLoaded', () => {
            runner.run();
        });
    </script>
</body>
</html>
