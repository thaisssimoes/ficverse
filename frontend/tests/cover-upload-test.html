<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Upload de Capa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #6366f1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #4f46e5;
        }
        .preview {
            max-width: 200px;
            margin-top: 10px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Upload de Capa</h1>

    <div class="test-section">
        <h2>1. Criar Fanfic com Capa</h2>
        <form id="create-form">
            <div class="form-group">
                <label>Título *</label>
                <input type="text" id="create-title" value="Teste de Upload" required>
            </div>
            <div class="form-group">
                <label>Sinopse *</label>
                <textarea id="create-synopsis" required>Esta é uma fanfic de teste para verificar o upload de capa.</textarea>
            </div>
            <div class="form-group">
                <label>Categoria *</label>
                <select id="create-category" required>
                    <option value="Teste">Teste</option>
                    <option value="Romance">Romance</option>
                    <option value="Aventura">Aventura</option>
                </select>
            </div>
            <div class="form-group">
                <label>Capa</label>
                <input type="file" id="create-cover" accept="image/*">
                <img id="create-preview" class="preview" style="display:none;">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="create-interactive" style="width:auto;">
                    Modo Interativo
                </label>
            </div>
            <button type="submit">Criar Fanfic</button>
        </form>
        <div id="create-result" class="log" style="margin-top: 15px;"></div>
    </div>

    <div class="test-section">
        <h2>2. Atualizar Capa de Fanfic Existente</h2>
        <form id="update-form">
            <div class="form-group">
                <label>ID da Fanfic *</label>
                <input type="number" id="update-id" placeholder="Digite o ID da fanfic" required>
            </div>
            <div class="form-group">
                <label>Nova Capa</label>
                <input type="file" id="update-cover" accept="image/*">
                <img id="update-preview" class="preview" style="display:none;">
            </div>
            <button type="submit">Atualizar Capa</button>
        </form>
        <div id="update-result" class="log" style="margin-top: 15px;"></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            element.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            element.scrollTop = element.scrollHeight;
        }

        // Preview de imagem
        document.getElementById('create-cover').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('create-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                log('create-result', `Arquivo selecionado: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
            }
        });

        document.getElementById('update-cover').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('update-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                log('update-result', `Arquivo selecionado: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
            }
        });

        // Criar fanfic
        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('create-result');
            resultDiv.innerHTML = '';
            
            const title = document.getElementById('create-title').value;
            const synopsis = document.getElementById('create-synopsis').value;
            const category = document.getElementById('create-category').value;
            const coverFile = document.getElementById('create-cover').files[0];
            const interactiveMode = document.getElementById('create-interactive').checked;

            log('create-result', '📤 Iniciando criação de fanfic...');
            log('create-result', `Título: ${title}`);
            log('create-result', `Categoria: ${category}`);
            log('create-result', `Modo Interativo: ${interactiveMode}`);
            log('create-result', `Capa: ${coverFile ? coverFile.name : 'Nenhuma'}`);

            try {
                const formData = new FormData();
                formData.append('title', title);
                formData.append('synopsis', synopsis);
                formData.append('category', category);
                formData.append('disclaimer', '');
                formData.append('interactive_mode', interactiveMode.toString());

                if (coverFile) {
                    formData.append('cover', coverFile);
                    log('create-result', `Adicionando arquivo: ${coverFile.name} (${coverFile.type})`);
                }

                log('create-result', '🔐 Verificando autenticação...');
                if (!api.token) {
                    throw new Error('Você precisa estar logado! Faça login primeiro.');
                }

                log('create-result', '📡 Enviando requisição...');
                const response = await fetch(`${API_BASE_URL}/fanfics`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${api.token}`
                    },
                    body: formData
                });

                log('create-result', `Status da resposta: ${response.status} ${response.statusText}`);

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    log('create-result', `Erro do servidor: ${JSON.stringify(error)}`, 'error');
                    throw new Error(error.error?.message || error.message || 'Erro ao criar fanfic');
                }

                const result = await response.json();
                log('create-result', '✅ Fanfic criada com sucesso!', 'success');
                log('create-result', `ID: ${result.id}`);
                log('create-result', `Cover URL: ${result.cover_url || 'Nenhuma'}`);
                log('create-result', `Resposta completa: ${JSON.stringify(result, null, 2)}`);

                // Atualizar campo de ID para teste de update
                document.getElementById('update-id').value = result.id;

            } catch (error) {
                log('create-result', `❌ Erro: ${error.message}`, 'error');
                console.error('Erro completo:', error);
            }
        });

        // Atualizar capa
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('update-result');
            resultDiv.innerHTML = '';
            
            const fanficId = document.getElementById('update-id').value;
            const coverFile = document.getElementById('update-cover').files[0];

            if (!coverFile) {
                log('update-result', '⚠️ Selecione uma imagem primeiro!', 'error');
                return;
            }

            log('update-result', '📤 Iniciando atualização de capa...');
            log('update-result', `ID da Fanfic: ${fanficId}`);
            log('update-result', `Nova Capa: ${coverFile.name}`);

            try {
                const formData = new FormData();
                formData.append('cover', coverFile);
                formData.append('title', 'dummy'); // Backend requer title
                formData.append('synopsis', 'dummy'); // Backend requer synopsis
                formData.append('category', 'dummy'); // Backend requer category

                log('update-result', '🔐 Verificando autenticação...');
                if (!api.token) {
                    throw new Error('Você precisa estar logado! Faça login primeiro.');
                }

                log('update-result', '📡 Enviando requisição...');
                const response = await fetch(`${API_BASE_URL}/fanfics/${fanficId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${api.token}`
                    },
                    body: formData
                });

                log('update-result', `Status da resposta: ${response.status} ${response.statusText}`);

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    log('update-result', `Erro do servidor: ${JSON.stringify(error)}`, 'error');
                    throw new Error(error.error?.message || error.message || 'Erro ao atualizar capa');
                }

                const result = await response.json();
                log('update-result', '✅ Capa atualizada com sucesso!', 'success');
                log('update-result', `Cover URL: ${result.cover_url || 'Nenhuma'}`);
                log('update-result', `Resposta completa: ${JSON.stringify(result, null, 2)}`);

            } catch (error) {
                log('update-result', `❌ Erro: ${error.message}`, 'error');
                console.error('Erro completo:', error);
            }
        });

        // Verificar autenticação ao carregar
        window.addEventListener('load', () => {
            if (api.token) {
                log('create-result', '✅ Usuário autenticado', 'success');
                log('update-result', '✅ Usuário autenticado', 'success');
            } else {
                log('create-result', '⚠️ Usuário não autenticado. Faça login primeiro!', 'error');
                log('update-result', '⚠️ Usuário não autenticado. Faça login primeiro!', 'error');
            }
        });
    </script>
</body>
</html>
