<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Text Editor Test</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .test-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .test-result {
            margin-top: 1rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .editor-container {
            background: white;
            min-height: 200px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Rich Text Editor Component Test</h1>
        
        <div class="test-section">
            <h2>Test 1: Editor Initialization</h2>
            <div id="editor-1" class="editor-container"></div>
            <button onclick="testInit()" class="btn btn-primary">Test Init</button>
            <div id="result-1" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Test 2: Set and Get Content</h2>
            <div id="editor-2" class="editor-container"></div>
            <button onclick="testSetGetContent()" class="btn btn-primary">Test Set/Get Content</button>
            <div id="result-2" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Test 3: HTML Preservation</h2>
            <div id="editor-3" class="editor-container"></div>
            <button onclick="testHTMLPreservation()" class="btn btn-primary">Test HTML Preservation</button>
            <div id="result-3" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Test 4: isEmpty Check</h2>
            <div id="editor-4" class="editor-container"></div>
            <button onclick="testIsEmpty()" class="btn btn-primary">Test isEmpty</button>
            <div id="result-4" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Test 5: Clear Content</h2>
            <div id="editor-5" class="editor-container"></div>
            <button onclick="testClear()" class="btn btn-primary">Test Clear</button>
            <div id="result-5" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Interactive Test: Try the Editor</h2>
            <p>Type some text, format it, and click "Get Content" to see the HTML output:</p>
            <div id="editor-interactive" class="editor-container"></div>
            <button onclick="showInteractiveContent()" class="btn btn-primary">Get Content</button>
            <div id="result-interactive" class="test-result"></div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="../js/rich-text-editor.js"></script>
    <script>
        let editors = {};

        function testInit() {
            const resultDiv = document.getElementById('result-1');
            try {
                editors.test1 = new RichTextEditor('editor-1', {
                    placeholder: 'Test editor...'
                });
                const success = editors.test1.init();
                
                if (success && editors.test1.quill) {
                    resultDiv.innerHTML = '<span class="success">✓ PASS: Editor initialized successfully</span>';
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ FAIL: Editor initialization failed</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ FAIL: ${error.message}</span>`;
            }
        }

        function testSetGetContent() {
            const resultDiv = document.getElementById('result-2');
            try {
                editors.test2 = new RichTextEditor('editor-2');
                editors.test2.init();
                
                const testHTML = '<p><strong>Bold text</strong> and <em>italic text</em></p>';
                editors.test2.setContent(testHTML);
                
                const retrieved = editors.test2.getContent();
                
                if (retrieved.includes('Bold text') && retrieved.includes('italic text')) {
                    resultDiv.innerHTML = `<span class="success">✓ PASS: Content set and retrieved</span>\nSet: ${testHTML}\nGot: ${retrieved}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ FAIL: Content mismatch</span>\nSet: ${testHTML}\nGot: ${retrieved}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ FAIL: ${error.message}</span>`;
            }
        }

        function testHTMLPreservation() {
            const resultDiv = document.getElementById('result-3');
            try {
                editors.test3 = new RichTextEditor('editor-3');
                editors.test3.init();
                
                const testHTML = '<h1>Heading</h1><p>Paragraph with <strong>bold</strong> and <em>italic</em></p><ul><li>Item 1</li><li>Item 2</li></ul>';
                editors.test3.setContent(testHTML);
                
                const retrieved = editors.test3.getContent();
                
                const hasHeading = retrieved.includes('Heading');
                const hasBold = retrieved.includes('bold');
                const hasItalic = retrieved.includes('italic');
                const hasList = retrieved.includes('Item 1') && retrieved.includes('Item 2');
                
                if (hasHeading && hasBold && hasItalic && hasList) {
                    resultDiv.innerHTML = `<span class="success">✓ PASS: HTML formatting preserved</span>\nOriginal: ${testHTML}\nRetrieved: ${retrieved}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ FAIL: HTML formatting not preserved</span>\nOriginal: ${testHTML}\nRetrieved: ${retrieved}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ FAIL: ${error.message}</span>`;
            }
        }

        function testIsEmpty() {
            const resultDiv = document.getElementById('result-4');
            try {
                editors.test4 = new RichTextEditor('editor-4');
                editors.test4.init();
                
                const emptyCheck1 = editors.test4.isEmpty();
                
                editors.test4.setContent('<p>Some content</p>');
                const emptyCheck2 = editors.test4.isEmpty();
                
                if (emptyCheck1 === true && emptyCheck2 === false) {
                    resultDiv.innerHTML = '<span class="success">✓ PASS: isEmpty() works correctly</span>\nEmpty editor: true\nWith content: false';
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ FAIL: isEmpty() not working</span>\nEmpty editor: ${emptyCheck1}\nWith content: ${emptyCheck2}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ FAIL: ${error.message}</span>`;
            }
        }

        function testClear() {
            const resultDiv = document.getElementById('result-5');
            try {
                editors.test5 = new RichTextEditor('editor-5');
                editors.test5.init();
                
                editors.test5.setContent('<p>Content to be cleared</p>');
                const beforeClear = editors.test5.isEmpty();
                
                editors.test5.clear();
                const afterClear = editors.test5.isEmpty();
                
                if (beforeClear === false && afterClear === true) {
                    resultDiv.innerHTML = '<span class="success">✓ PASS: clear() works correctly</span>\nBefore clear: has content\nAfter clear: empty';
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ FAIL: clear() not working</span>\nBefore: ${beforeClear}\nAfter: ${afterClear}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ FAIL: ${error.message}</span>`;
            }
        }

        function showInteractiveContent() {
            const resultDiv = document.getElementById('result-interactive');
            try {
                const content = editors.interactive.getContent();
                const text = editors.interactive.getText();
                const isEmpty = editors.interactive.isEmpty();
                
                resultDiv.innerHTML = `HTML Content:\n${content}\n\nPlain Text:\n${text}\n\nisEmpty: ${isEmpty}`;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        // Initialize interactive editor on load
        window.addEventListener('DOMContentLoaded', () => {
            editors.interactive = new RichTextEditor('editor-interactive', {
                placeholder: 'Try typing and formatting text here...'
            });
            editors.interactive.init();
        });
    </script>
</body>
</html>
