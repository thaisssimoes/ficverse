<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Posicionamento do Header</title>
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/ui-refinements.css">
    <style>
        /* Debug styles */
        .debug-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            max-width: 400px;
        }
        
        .debug-info h3 {
            color: #00ffff;
            margin-bottom: 0.5rem;
        }
        
        .debug-info p {
            margin: 0.25rem 0;
        }
        
        .highlight-header {
            outline: 3px solid red !important;
        }
        
        .highlight-user-menu {
            outline: 3px solid yellow !important;
        }
        
        .highlight-dropdown {
            outline: 3px solid green !important;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="main-header highlight-header">
        <div class="header-container">
            <a href="/" class="logo">FicVerse</a>
            
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Busca em FicVerse...">
                <button class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
            
            <div class="header-actions">
                <button class="categories-btn">
                    <span>Categorias</span>
                    <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                
                <button class="notification-bell" style="display: none;">
                    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-badge" style="display: none;">0</span>
                </button>
                
                <div class="auth-area">
                    <div class="auth-buttons">
                        <a href="login.html" class="btn-entrar">Entrar</a>
                        <a href="register.html" class="btn-cadastrar">Cadastrar</a>
                    </div>
                    
                    <div class="user-menu highlight-user-menu" style="display: block;">
                        <button class="user-avatar-btn">
                            <img src="https://ui-avatars.com/api/?name=Test+User&background=6366f1&color=fff&size=128" alt="Avatar" class="user-avatar">
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="user-dropdown highlight-dropdown" style="display: block;">
            <a href="profile.html" class="user-dropdown-item">Meu Perfil</a>
            <a href="dashboard.html" class="user-dropdown-item">Minhas Fanfics</a>
            <a href="#settings" class="user-dropdown-item">Configurações</a>
            <button class="user-dropdown-item logout-btn">Sair</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-background">
            <div class="hero-overlay"></div>
        </div>
        
        <div class="hero-content">
            <div class="hero-info">
                <span class="interactive-badge">✨ DESTAQUE INTERATIVO</span>
                <h1 class="hero-title">Fanfic de Teste</h1>
                <p class="hero-subtitle">Esta é uma fanfic de teste para debug</p>
                <a href="#" class="btn-start-reading">Começar a Ler</a>
            </div>
        </div>
    </section>

    <!-- Debug Info -->
    <div class="debug-info">
        <h3>Debug Info</h3>
        <p id="header-position"></p>
        <p id="user-menu-position"></p>
        <p id="dropdown-position"></p>
        <p id="header-zindex"></p>
        <p id="dropdown-zindex"></p>
        <hr style="margin: 0.5rem 0; border-color: #333;">
        <p><strong>Legenda:</strong></p>
        <p style="color: red;">■ Header (vermelho)</p>
        <p style="color: yellow;">■ User Menu (amarelo)</p>
        <p style="color: green;">■ Dropdown (verde)</p>
    </div>

    <script>
        function updateDebugInfo() {
            const header = document.querySelector('.main-header');
            const userMenu = document.querySelector('.user-menu');
            const dropdown = document.querySelector('.user-dropdown');
            
            if (header) {
                const headerRect = header.getBoundingClientRect();
                const headerStyle = window.getComputedStyle(header);
                document.getElementById('header-position').innerHTML = 
                    `Header: top=${headerRect.top}px, position=${headerStyle.position}, z-index=${headerStyle.zIndex}`;
                document.getElementById('header-zindex').innerHTML = 
                    `Header z-index: ${headerStyle.zIndex}`;
            }
            
            if (userMenu) {
                const menuRect = userMenu.getBoundingClientRect();
                const menuStyle = window.getComputedStyle(userMenu);
                document.getElementById('user-menu-position').innerHTML = 
                    `User Menu: top=${menuRect.top}px, left=${menuRect.left}px, position=${menuStyle.position}`;
            }
            
            if (dropdown) {
                const dropdownRect = dropdown.getBoundingClientRect();
                const dropdownStyle = window.getComputedStyle(dropdown);
                document.getElementById('dropdown-position').innerHTML = 
                    `Dropdown: top=${dropdownRect.top}px, right=${dropdownStyle.right}, position=${dropdownStyle.position}`;
                document.getElementById('dropdown-zindex').innerHTML = 
                    `Dropdown z-index: ${dropdownStyle.zIndex}`;
            }
        }
        
        // Update on load and scroll
        window.addEventListener('load', updateDebugInfo);
        window.addEventListener('scroll', updateDebugInfo);
        window.addEventListener('resize', updateDebugInfo);
        
        // Update every second
        setInterval(updateDebugInfo, 1000);
        
        console.log('='.repeat(50));
        console.log('DEBUG: Header Position Test');
        console.log('='.repeat(50));
        console.log('Verifique:');
        console.log('1. O header está fixo no topo?');
        console.log('2. O user menu está dentro do header?');
        console.log('3. O dropdown aparece abaixo do header?');
        console.log('='.repeat(50));
    </script>
</body>
</html>
