<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions Modal Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background-color: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background-color: #fef1f0;
        }
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-weight: bold;
        }
        .error-details {
            color: #d32f2f;
            font-family: monospace;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Interactive Questions Modal - Unit Tests</h1>
    <div id="test-results"></div>
    <div id="test-summary" class="test-summary"></div>

    <!-- Hidden test container -->
    <div id="test-container" style="display: none;"></div>

    <script>
        // Simple test framework
        class TestRunner {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            describe(suiteName, testFn) {
                const suite = {
                    name: suiteName,
                    tests: []
                };
                this.currentSuite = suite;
                testFn();
                this.tests.push(suite);
                this.currentSuite = null;
            }

            it(testName, testFn) {
                if (!this.currentSuite) {
                    throw new Error('Test must be inside a describe block');
                }
                this.currentSuite.tests.push({
                    name: testName,
                    fn: testFn
                });
            }

            async run() {
                const resultsContainer = document.getElementById('test-results');
                let totalTests = 0;
                let passedTests = 0;

                for (const suite of this.tests) {
                    const suiteDiv = document.createElement('div');
                    suiteDiv.className = 'test-suite';
                    suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;

                    for (const test of suite.tests) {
                        totalTests++;
                        const testDiv = document.createElement('div');
                        testDiv.className = 'test-case';

                        try {
                            await test.fn();
                            testDiv.classList.add('pass');
                            testDiv.innerHTML = `✓ ${test.name}`;
                            passedTests++;
                        } catch (error) {
                            testDiv.classList.add('fail');
                            testDiv.innerHTML = `✗ ${test.name}<div class="error-details">${error.message}</div>`;
                        }

                        suiteDiv.appendChild(testDiv);
                    }

                    resultsContainer.appendChild(suiteDiv);
                }

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    Tests: ${passedTests}/${totalTests} passed
                    ${passedTests === totalTests ? '✓ All tests passed!' : '✗ Some tests failed'}
                `;
                summaryDiv.style.color = passedTests === totalTests ? '#4CAF50' : '#f44336';
            }
        }

        // Assertion helpers
        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy value but got ${actual}`);
                    }
                },
                toBeFalsy() {
                    if (actual) {
                        throw new Error(`Expected falsy value but got ${actual}`);
                    }
                },
                toContain(expected) {
                    if (!actual.includes(expected)) {
                        throw new Error(`Expected "${actual}" to contain "${expected}"`);
                    }
                },
                toBeGreaterThan(expected) {
                    if (actual <= expected) {
                        throw new Error(`Expected ${actual} to be greater than ${expected}`);
                    }
                },
                toHaveLength(expected) {
                    if (actual.length !== expected) {
                        throw new Error(`Expected length ${expected} but got ${actual.length}`);
                    }
                }
            };
        }

        // Mock questions data
        const mockQuestions = [
            { id: 1, fanfic_id: 1, question_text: 'What is your name?', placeholder: '{{name}}' },
            { id: 2, fanfic_id: 1, question_text: 'What is your favorite color?', placeholder: '{{color}}' },
            { id: 3, fanfic_id: 1, question_text: 'Where do you live?', placeholder: '{{location}}' }
        ];

        // Helper function to create modal structure
        function createModalStructure() {
            const container = document.getElementById('test-container');
            container.innerHTML = `
                <div id="questions-modal" class="modal" style="display: none;">
                    <div class="modal-overlay"></div>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Perguntas Interativas</h2>
                            <button class="modal-close">&times;</button>
                        </div>
                        <div class="modal-body">
                            <p class="modal-description">
                                Responda às perguntas abaixo para personalizar sua experiência de leitura.
                            </p>
                            <form id="questions-form">
                                <div id="questions-container"></div>
                                <div class="validation-message" id="validation-message" style="display: none;">
                                    Por favor, responda todas as perguntas antes de continuar.
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary">Cancelar</button>
                            <button type="button" class="btn btn-primary">Salvar Respostas</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper function to render questions
        function renderQuestions(questions, existingAnswers = {}) {
            const questionsContainer = document.getElementById('questions-container');
            questionsContainer.innerHTML = questions.map((question, index) => {
                const existingAnswer = existingAnswers[question.placeholder] || '';
                return `
                    <div class="question-item">
                        <label class="question-label" for="question-${question.id}">
                            ${index + 1}. ${question.question_text}
                        </label>
                        <input 
                            type="text" 
                            id="question-${question.id}" 
                            class="question-input" 
                            data-placeholder="${question.placeholder}"
                            value="${existingAnswer}"
                            placeholder="Digite sua resposta..."
                            required
                        />
                    </div>
                `;
            }).join('');
        }

        // Helper function to validate answers
        function validateAnswers() {
            const questionsContainer = document.getElementById('questions-container');
            const inputs = questionsContainer.querySelectorAll('.question-input');
            const validationMessage = document.getElementById('validation-message');
            
            const answers = {};
            let allAnswered = true;
            
            inputs.forEach(input => {
                const placeholder = input.dataset.placeholder;
                const value = input.value.trim();
                
                if (value === '') {
                    allAnswered = false;
                    input.classList.add('error');
                } else {
                    input.classList.remove('error');
                    answers[placeholder] = value;
                }
            });
            
            if (!allAnswered) {
                validationMessage.style.display = 'block';
                return null;
            }
            
            validationMessage.style.display = 'none';
            return answers;
        }

        // Test Suite
        const runner = new TestRunner();

        runner.describe('Questions Modal - Display Tests', () => {
            runner.it('should display all questions in the modal', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const questionItems = document.querySelectorAll('.question-item');
                expect(questionItems.length).toBe(3);
            });

            runner.it('should display question text and input for each question', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const labels = document.querySelectorAll('.question-label');
                const inputs = document.querySelectorAll('.question-input');
                
                expect(labels.length).toBe(3);
                expect(inputs.length).toBe(3);
                
                expect(labels[0].textContent).toContain('What is your name?');
                expect(labels[1].textContent).toContain('What is your favorite color?');
                expect(labels[2].textContent).toContain('Where do you live?');
            });

            runner.it('should set correct placeholder attributes on inputs', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const inputs = document.querySelectorAll('.question-input');
                
                expect(inputs[0].dataset.placeholder).toBe('{{name}}');
                expect(inputs[1].dataset.placeholder).toBe('{{color}}');
                expect(inputs[2].dataset.placeholder).toBe('{{location}}');
            });
        });

        runner.describe('Questions Modal - Validation Tests', () => {
            runner.it('should reject submission when answers are missing', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Leave all inputs empty
                const result = validateAnswers();
                
                expect(result).toBe(null);
                
                const validationMessage = document.getElementById('validation-message');
                expect(validationMessage.style.display).toBe('block');
            });

            runner.it('should reject submission when some answers are missing', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Fill only first two inputs
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'John';
                inputs[1].value = 'Blue';
                // Leave third empty
                
                const result = validateAnswers();
                
                expect(result).toBe(null);
                
                const validationMessage = document.getElementById('validation-message');
                expect(validationMessage.style.display).toBe('block');
            });

            runner.it('should accept submission when all answers are provided', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Fill all inputs
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'John';
                inputs[1].value = 'Blue';
                inputs[2].value = 'New York';
                
                const result = validateAnswers();
                
                expect(result).toBeTruthy();
                expect(result['{{name}}']).toBe('John');
                expect(result['{{color}}']).toBe('Blue');
                expect(result['{{location}}']).toBe('New York');
                
                const validationMessage = document.getElementById('validation-message');
                expect(validationMessage.style.display).toBe('none');
            });

            runner.it('should mark empty inputs with error class', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Fill only first input
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'John';
                
                validateAnswers();
                
                expect(inputs[0].classList.contains('error')).toBeFalsy();
                expect(inputs[1].classList.contains('error')).toBeTruthy();
                expect(inputs[2].classList.contains('error')).toBeTruthy();
            });

            runner.it('should trim whitespace from answers', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Fill inputs with whitespace
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = '  John  ';
                inputs[1].value = ' Blue ';
                inputs[2].value = 'New York  ';
                
                const result = validateAnswers();
                
                expect(result['{{name}}']).toBe('John');
                expect(result['{{color}}']).toBe('Blue');
                expect(result['{{location}}']).toBe('New York');
            });

            runner.it('should reject whitespace-only answers', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                // Fill inputs with only whitespace
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = '   ';
                inputs[1].value = 'Blue';
                inputs[2].value = 'New York';
                
                const result = validateAnswers();
                
                expect(result).toBe(null);
                expect(inputs[0].classList.contains('error')).toBeTruthy();
            });
        });

        runner.describe('Questions Modal - Pre-filled Answers Tests', () => {
            runner.it('should display existing answers when editing', () => {
                createModalStructure();
                
                const existingAnswers = {
                    '{{name}}': 'Alice',
                    '{{color}}': 'Red',
                    '{{location}}': 'Paris'
                };
                
                renderQuestions(mockQuestions, existingAnswers);
                
                const inputs = document.querySelectorAll('.question-input');
                
                expect(inputs[0].value).toBe('Alice');
                expect(inputs[1].value).toBe('Red');
                expect(inputs[2].value).toBe('Paris');
            });

            runner.it('should allow updating existing answers', () => {
                createModalStructure();
                
                const existingAnswers = {
                    '{{name}}': 'Alice',
                    '{{color}}': 'Red',
                    '{{location}}': 'Paris'
                };
                
                renderQuestions(mockQuestions, existingAnswers);
                
                // Update answers
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'Bob';
                inputs[1].value = 'Green';
                inputs[2].value = 'London';
                
                const result = validateAnswers();
                
                expect(result['{{name}}']).toBe('Bob');
                expect(result['{{color}}']).toBe('Green');
                expect(result['{{location}}']).toBe('London');
            });

            runner.it('should handle partial existing answers', () => {
                createModalStructure();
                
                const existingAnswers = {
                    '{{name}}': 'Charlie'
                    // Other answers missing
                };
                
                renderQuestions(mockQuestions, existingAnswers);
                
                const inputs = document.querySelectorAll('.question-input');
                
                expect(inputs[0].value).toBe('Charlie');
                expect(inputs[1].value).toBe('');
                expect(inputs[2].value).toBe('');
            });
        });

        runner.describe('Questions Modal - Answer Submission Tests', () => {
            runner.it('should collect all answers with correct placeholders', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'Test Name';
                inputs[1].value = 'Test Color';
                inputs[2].value = 'Test Location';
                
                const result = validateAnswers();
                
                expect(Object.keys(result).length).toBe(3);
                expect(result).toEqual({
                    '{{name}}': 'Test Name',
                    '{{color}}': 'Test Color',
                    '{{location}}': 'Test Location'
                });
            });

            runner.it('should handle special characters in answers', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = "O'Brien";
                inputs[1].value = 'Blue & Green';
                inputs[2].value = 'São Paulo';
                
                const result = validateAnswers();
                
                expect(result['{{name}}']).toBe("O'Brien");
                expect(result['{{color}}']).toBe('Blue & Green');
                expect(result['{{location}}']).toBe('São Paulo');
            });

            runner.it('should handle long answers', () => {
                createModalStructure();
                renderQuestions(mockQuestions);
                
                const longAnswer = 'This is a very long answer that contains multiple words and should be handled correctly by the system without any issues';
                
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = longAnswer;
                inputs[1].value = 'Blue';
                inputs[2].value = 'New York';
                
                const result = validateAnswers();
                
                expect(result['{{name}}']).toBe(longAnswer);
            });
        });

        runner.describe('Questions Modal - Edge Cases', () => {
            runner.it('should handle empty questions list', () => {
                createModalStructure();
                renderQuestions([]);
                
                const questionItems = document.querySelectorAll('.question-item');
                expect(questionItems.length).toBe(0);
            });

            runner.it('should handle single question', () => {
                createModalStructure();
                renderQuestions([mockQuestions[0]]);
                
                const questionItems = document.querySelectorAll('.question-item');
                expect(questionItems.length).toBe(1);
                
                const inputs = document.querySelectorAll('.question-input');
                inputs[0].value = 'Answer';
                
                const result = validateAnswers();
                expect(result).toBeTruthy();
                expect(Object.keys(result).length).toBe(1);
            });

            runner.it('should handle many questions', () => {
                createModalStructure();
                
                const manyQuestions = Array.from({ length: 10 }, (_, i) => ({
                    id: i + 1,
                    fanfic_id: 1,
                    question_text: `Question ${i + 1}?`,
                    placeholder: `{{q${i + 1}}}`
                }));
                
                renderQuestions(manyQuestions);
                
                const questionItems = document.querySelectorAll('.question-item');
                expect(questionItems.length).toBe(10);
            });
        });

        // Run all tests
        window.addEventListener('DOMContentLoaded', () => {
            runner.run();
        });
    </script>
</body>
</html>
