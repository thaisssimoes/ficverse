<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Section Tests</title>
    <link rel="stylesheet" href="../css/landing.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 2rem;
        }
        
        .test-section {
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        
        .test-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #7C3AED;
        }
        
        .test-result {
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
        }
        
        .test-pass {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10B981;
            color: #10B981;
        }
        
        .test-fail {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #EF4444;
            color: #EF4444;
        }
        
        .test-info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3B82F6;
            color: #3B82F6;
        }
    </style>
</head>
<body>
    <h1>Trending Section Component Tests</h1>
    
    <div class="test-section">
        <h2 class="test-title">Test 1: HTML Structure</h2>
        <div id="test1-results"></div>
    </div>
    
    <div class="test-section">
        <h2 class="test-title">Test 2: CSS Classes</h2>
        <div id="test2-results"></div>
    </div>
    
    <div class="test-section">
        <h2 class="test-title">Test 3: Component Rendering</h2>
        <div id="test3-results"></div>
    </div>
    
    <div class="test-section">
        <h2 class="test-title">Test 4: Visual Preview</h2>
        <div id="test4-preview"></div>
    </div>
    
    <script>
        // Test utilities
        function pass(message) {
            return `<div class="test-result test-pass">✓ ${message}</div>`;
        }
        
        function fail(message) {
            return `<div class="test-result test-fail">✗ ${message}</div>`;
        }
        
        function info(message) {
            return `<div class="test-result test-info">ℹ ${message}</div>`;
        }
        
        // Test 1: HTML Structure
        function testHTMLStructure() {
            const results = [];
            
            // Check if trending section exists in main page
            results.push(info('Checking HTML structure from index.html...'));
            
            // We'll create a mock structure to test
            const mockHTML = `
                <section id="bombando" class="trending-section">
                    <div class="container">
                        <h2 class="section-title">Bombando Hoje 🔥</h2>
                        <div class="fanfic-carousel">
                            <button class="carousel-nav prev" id="trending-prev-btn">‹</button>
                            <div class="fanfic-grid" id="trending-fanfics-grid"></div>
                            <button class="carousel-nav next" id="trending-next-btn">›</button>
                        </div>
                    </div>
                </section>
            `;
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(mockHTML, 'text/html');
            
            // Test section exists
            const section = doc.querySelector('.trending-section');
            results.push(section ? pass('Trending section element exists') : fail('Trending section element missing'));
            
            // Test title
            const title = doc.querySelector('.section-title');
            results.push(title ? pass('Section title exists') : fail('Section title missing'));
            results.push(title && title.textContent.includes('Bombando Hoje') ? 
                pass('Title contains "Bombando Hoje 🔥"') : 
                fail('Title text incorrect'));
            
            // Test carousel structure
            const carousel = doc.querySelector('.fanfic-carousel');
            results.push(carousel ? pass('Fanfic carousel exists') : fail('Fanfic carousel missing'));
            
            // Test navigation buttons
            const prevBtn = doc.querySelector('.carousel-nav.prev');
            const nextBtn = doc.querySelector('.carousel-nav.next');
            results.push(prevBtn ? pass('Previous button exists') : fail('Previous button missing'));
            results.push(nextBtn ? pass('Next button exists') : fail('Next button missing'));
            
            // Test grid
            const grid = doc.querySelector('.fanfic-grid');
            results.push(grid ? pass('Fanfic grid exists') : fail('Fanfic grid missing'));
            
            document.getElementById('test1-results').innerHTML = results.join('');
        }
        
        // Test 2: CSS Classes
        function testCSSClasses() {
            const results = [];
            
            results.push(info('Checking CSS classes are defined...'));
            
            const classesToCheck = [
                'trending-section',
                'fanfic-carousel',
                'carousel-nav',
                'fanfic-grid',
                'fanfic-card',
                'fanfic-cover',
                'fanfic-badge',
                'fanfic-info',
                'fanfic-title',
                'fanfic-author',
                'fanfic-stats'
            ];
            
            classesToCheck.forEach(className => {
                // Check if class has styles defined
                const testEl = document.createElement('div');
                testEl.className = className;
                document.body.appendChild(testEl);
                const styles = window.getComputedStyle(testEl);
                const hasStyles = styles.display !== 'inline'; // Default display for div
                document.body.removeChild(testEl);
                
                results.push(hasStyles ? 
                    pass(`Class .${className} has styles defined`) : 
                    info(`Class .${className} may use default styles`));
            });
            
            document.getElementById('test2-results').innerHTML = results.join('');
        }
        
        // Test 3: Component Rendering
        function testComponentRendering() {
            const results = [];
            
            results.push(info('Testing fanfic card rendering...'));
            
            // Mock fanfic data
            const mockFanfic = {
                id: 1,
                title: 'Test Fanfic',
                cover_url: 'https://via.placeholder.com/300x450',
                is_interactive: true,
                author: { username: 'testuser' },
                views: 1234,
                likes: 567
            };
            
            // Test card HTML generation
            const cardHTML = `
                <div class="fanfic-card" data-fanfic-id="${mockFanfic.id}">
                    <div class="fanfic-cover">
                        <img src="${mockFanfic.cover_url}" alt="${mockFanfic.title}">
                        <span class="fanfic-badge interactive">⚡ INTERATIVO</span>
                    </div>
                    <div class="fanfic-info">
                        <h3 class="fanfic-title">${mockFanfic.title}</h3>
                        <p class="fanfic-author">Por @${mockFanfic.author.username}</p>
                        <div class="fanfic-stats">
                            <span class="stat-item">👁️ 1.2k</span>
                            <span class="stat-item">❤️ 567</span>
                        </div>
                    </div>
                </div>
            `;
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(cardHTML, 'text/html');
            const card = doc.querySelector('.fanfic-card');
            
            results.push(card ? pass('Fanfic card renders correctly') : fail('Fanfic card failed to render'));
            results.push(card && card.dataset.fanficId === '1' ? 
                pass('Card has correct data-fanfic-id') : 
                fail('Card missing or incorrect data-fanfic-id'));
            
            const badge = doc.querySelector('.fanfic-badge');
            results.push(badge ? pass('Badge element exists') : fail('Badge element missing'));
            results.push(badge && badge.classList.contains('interactive') ? 
                pass('Interactive badge has correct class') : 
                fail('Interactive badge class incorrect'));
            
            const stats = doc.querySelector('.fanfic-stats');
            results.push(stats ? pass('Stats section exists') : fail('Stats section missing'));
            
            document.getElementById('test3-results').innerHTML = results.join('');
        }
        
        // Test 4: Visual Preview
        function createVisualPreview() {
            const mockFanfics = [
                {
                    id: 1,
                    title: 'A Escolha do Dragão',
                    cover_url: 'https://via.placeholder.com/300x450/7C3AED/ffffff?text=Fanfic+1',
                    is_interactive: true,
                    author: { username: 'autor1' },
                    views: 1234,
                    likes: 567
                },
                {
                    id: 2,
                    title: 'Romance nas Estrelas',
                    cover_url: 'https://via.placeholder.com/300x450/EC4899/ffffff?text=Fanfic+2',
                    is_interactive: false,
                    author: { username: 'autor2' },
                    views: 2345,
                    likes: 890
                },
                {
                    id: 3,
                    title: 'Aventura Épica',
                    cover_url: 'https://via.placeholder.com/300x450/3B82F6/ffffff?text=Fanfic+3',
                    is_interactive: true,
                    author: { username: 'autor3' },
                    views: 3456,
                    likes: 1234
                },
                {
                    id: 4,
                    title: 'Mistério na Cidade',
                    cover_url: 'https://via.placeholder.com/300x450/10B981/ffffff?text=Fanfic+4',
                    is_interactive: false,
                    author: { username: 'autor4' },
                    views: 4567,
                    likes: 1890
                }
            ];
            
            const formatNumber = (num) => {
                if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'k';
                }
                return num.toString();
            };
            
            const cardsHTML = mockFanfics.map(fanfic => {
                const badge = fanfic.is_interactive ? '⚡ INTERATIVO' : '📖 LEITURA';
                const badgeClass = fanfic.is_interactive ? 'interactive' : 'reading';
                
                return `
                    <div class="fanfic-card" data-fanfic-id="${fanfic.id}">
                        <div class="fanfic-cover">
                            <img src="${fanfic.cover_url}" alt="${fanfic.title}">
                            <span class="fanfic-badge ${badgeClass}">${badge}</span>
                        </div>
                        <div class="fanfic-info">
                            <h3 class="fanfic-title">${fanfic.title}</h3>
                            <p class="fanfic-author">Por @${fanfic.author.username}</p>
                            <div class="fanfic-stats">
                                <span class="stat-item">👁️ ${formatNumber(fanfic.views)}</span>
                                <span class="stat-item">❤️ ${formatNumber(fanfic.likes)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            const previewHTML = `
                <section class="trending-section">
                    <div class="container">
                        <h2 class="section-title">Bombando Hoje 🔥</h2>
                        <div class="fanfic-carousel">
                            <button class="carousel-nav prev">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                            </button>
                            <div class="fanfic-grid">
                                ${cardsHTML}
                            </div>
                            <button class="carousel-nav next">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
            `;
            
            document.getElementById('test4-preview').innerHTML = previewHTML;
            
            // Add scroll functionality
            const grid = document.querySelector('#test4-preview .fanfic-grid');
            const prevBtn = document.querySelector('#test4-preview .carousel-nav.prev');
            const nextBtn = document.querySelector('#test4-preview .carousel-nav.next');
            
            if (prevBtn && grid) {
                prevBtn.addEventListener('click', () => {
                    grid.scrollBy({ left: -grid.offsetWidth * 0.8, behavior: 'smooth' });
                });
            }
            
            if (nextBtn && grid) {
                nextBtn.addEventListener('click', () => {
                    grid.scrollBy({ left: grid.offsetWidth * 0.8, behavior: 'smooth' });
                });
            }
        }
        
        // Run all tests
        document.addEventListener('DOMContentLoaded', () => {
            testHTMLStructure();
            testCSSClasses();
            testComponentRendering();
            createVisualPreview();
        });
    </script>
</body>
</html>
