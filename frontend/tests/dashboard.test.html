<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background-color: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background-color: #fef1f0;
        }
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-weight: bold;
        }
        .error-details {
            color: #d32f2f;
            font-family: monospace;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Dashboard - Unit Tests</h1>
    <div id="test-results"></div>
    <div id="test-summary" class="test-summary"></div>

    <!-- Hidden test container -->
    <div id="test-container" style="display: none;"></div>

    <script>
        // Simple test framework
        class TestRunner {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            describe(suiteName, testFn) {
                const suite = {
                    name: suiteName,
                    tests: []
                };
                this.currentSuite = suite;
                testFn();
                this.tests.push(suite);
                this.currentSuite = null;
            }

            it(testName, testFn) {
                if (!this.currentSuite) {
                    throw new Error('Test must be inside a describe block');
                }
                this.currentSuite.tests.push({
                    name: testName,
                    fn: testFn
                });
            }

            async run() {
                const resultsContainer = document.getElementById('test-results');
                let totalTests = 0;
                let passedTests = 0;

                for (const suite of this.tests) {
                    const suiteDiv = document.createElement('div');
                    suiteDiv.className = 'test-suite';
                    suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;

                    for (const test of suite.tests) {
                        totalTests++;
                        const testDiv = document.createElement('div');
                        testDiv.className = 'test-case';

                        try {
                            await test.fn();
                            testDiv.classList.add('pass');
                            testDiv.innerHTML = `✓ ${test.name}`;
                            passedTests++;
                        } catch (error) {
                            testDiv.classList.add('fail');
                            testDiv.innerHTML = `✗ ${test.name}<div class="error-details">${error.message}</div>`;
                        }

                        suiteDiv.appendChild(testDiv);
                    }

                    resultsContainer.appendChild(suiteDiv);
                }

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    Tests: ${passedTests}/${totalTests} passed
                    ${passedTests === totalTests ? '✓ All tests passed!' : '✗ Some tests failed'}
                `;
                summaryDiv.style.color = passedTests === totalTests ? '#4CAF50' : '#f44336';
            }
        }

        // Assertion helpers
        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy value but got ${actual}`);
                    }
                },
                toBeFalsy() {
                    if (actual) {
                        throw new Error(`Expected falsy value but got ${actual}`);
                    }
                },
                toContain(expected) {
                    if (!actual.includes(expected)) {
                        throw new Error(`Expected "${actual}" to contain "${expected}"`);
                    }
                },
                toBeGreaterThan(expected) {
                    if (actual <= expected) {
                        throw new Error(`Expected ${actual} to be greater than ${expected}`);
                    }
                },
                toHaveLength(expected) {
                    if (actual.length !== expected) {
                        throw new Error(`Expected length ${expected} but got ${actual.length}`);
                    }
                }
            };
        }

        // Mock API Client
        class MockAPIClient {
            constructor() {
                this.token = 'mock-token';
                this.mockFanfics = [
                    { id: 1, title: 'Fanfic 1', category: 'Romance', author_id: 1, synopsis: 'Synopsis 1', disclaimer: 'Disclaimer 1' },
                    { id: 2, title: 'Fanfic 2', category: 'Aventura', author_id: 1, synopsis: 'Synopsis 2', disclaimer: 'Disclaimer 2' },
                    { id: 3, title: 'Fanfic 3', category: 'Fantasia', author_id: 2, synopsis: 'Synopsis 3', disclaimer: 'Disclaimer 3' }
                ];
                this.mockChapters = [
                    { id: 1, fanfic_id: 1, title: 'Chapter 1', content: 'Content 1', order: 1 },
                    { id: 2, fanfic_id: 1, title: 'Chapter 2', content: 'Content 2', order: 2 }
                ];
                this.mockQuestions = [
                    { id: 1, fanfic_id: 1, question_text: 'What is your name?', placeholder: 'name' },
                    { id: 2, fanfic_id: 1, question_text: 'Where are you from?', placeholder: 'place' }
                ];
                this.mockComments = [
                    { id: 1, fanfic_id: 1, chapter_id: null, content: 'Great fanfic!', username: 'User1', created_at: '2024-01-01T10:00:00Z' },
                    { id: 2, fanfic_id: 1, chapter_id: 1, content: 'Love this chapter!', username: 'User2', created_at: '2024-01-02T10:00:00Z' }
                ];
            }

            async getFanfics() {
                return { fanfics: this.mockFanfics };
            }

            async getAuthorFanfics(authorId) {
                return { fanfics: this.mockFanfics.filter(f => f.author_id === authorId) };
            }

            async updateFanfic(id, data) {
                const fanfic = this.mockFanfics.find(f => f.id === id);
                if (fanfic) {
                    Object.assign(fanfic, data);
                }
                return fanfic;
            }

            async deleteFanfic(id) {
                this.mockFanfics = this.mockFanfics.filter(f => f.id !== id);
                return { success: true };
            }

            async getChapters(fanficId) {
                return this.mockChapters.filter(c => c.fanfic_id === fanficId);
            }

            async createChapter(fanficId, data) {
                const newChapter = { id: Date.now(), fanfic_id: fanficId, ...data };
                this.mockChapters.push(newChapter);
                return newChapter;
            }

            async updateChapter(id, data) {
                const chapter = this.mockChapters.find(c => c.id === id);
                if (chapter) {
                    Object.assign(chapter, data);
                }
                return chapter;
            }

            async deleteChapter(id) {
                this.mockChapters = this.mockChapters.filter(c => c.id !== id);
                return { success: true };
            }

            async getQuestions(fanficId) {
                return this.mockQuestions.filter(q => q.fanfic_id === fanficId);
            }

            async createQuestion(fanficId, data) {
                const newQuestion = { id: Date.now(), fanfic_id: fanficId, ...data };
                this.mockQuestions.push(newQuestion);
                return newQuestion;
            }

            async updateQuestion(id, data) {
                const question = this.mockQuestions.find(q => q.id === id);
                if (question) {
                    Object.assign(question, data);
                }
                return question;
            }

            async deleteQuestion(id) {
                this.mockQuestions = this.mockQuestions.filter(q => q.id !== id);
                return { success: true };
            }

            async getComments(fanficId) {
                return this.mockComments.filter(c => c.fanfic_id === fanficId);
            }

            async deleteComment(id) {
                this.mockComments = this.mockComments.filter(c => c.id !== id);
                return { success: true };
            }
        }

        // Test Suite
        const runner = new TestRunner();

        runner.describe('Fanfic Filtering by Author', () => {
            runner.it('should filter fanfics by author ID', async () => {
                const mockAPI = new MockAPIClient();
                const authorId = 1;
                
                const result = await mockAPI.getAuthorFanfics(authorId);
                
                expect(result.fanfics).toHaveLength(2);
                expect(result.fanfics[0].author_id).toBe(authorId);
                expect(result.fanfics[1].author_id).toBe(authorId);
            });

            runner.it('should return empty array for author with no fanfics', async () => {
                const mockAPI = new MockAPIClient();
                const authorId = 999;
                
                const result = await mockAPI.getAuthorFanfics(authorId);
                
                expect(result.fanfics).toHaveLength(0);
            });

            runner.it('should not include other authors fanfics', async () => {
                const mockAPI = new MockAPIClient();
                const authorId = 1;
                
                const result = await mockAPI.getAuthorFanfics(authorId);
                
                const hasOtherAuthors = result.fanfics.some(f => f.author_id !== authorId);
                expect(hasOtherAuthors).toBeFalsy();
            });
        });

        runner.describe('Metadata Updates', () => {
            runner.it('should update fanfic title', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const newTitle = 'Updated Title';
                
                const result = await mockAPI.updateFanfic(fanficId, { title: newTitle });
                
                expect(result.title).toBe(newTitle);
            });

            runner.it('should update fanfic category', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const newCategory = 'Drama';
                
                const result = await mockAPI.updateFanfic(fanficId, { category: newCategory });
                
                expect(result.category).toBe(newCategory);
            });

            runner.it('should update fanfic synopsis', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const newSynopsis = 'Updated synopsis text';
                
                const result = await mockAPI.updateFanfic(fanficId, { synopsis: newSynopsis });
                
                expect(result.synopsis).toBe(newSynopsis);
            });

            runner.it('should update fanfic disclaimer', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const newDisclaimer = 'Updated disclaimer';
                
                const result = await mockAPI.updateFanfic(fanficId, { disclaimer: newDisclaimer });
                
                expect(result.disclaimer).toBe(newDisclaimer);
            });

            runner.it('should update multiple fields at once', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const updates = {
                    title: 'New Title',
                    category: 'Terror',
                    synopsis: 'New synopsis'
                };
                
                const result = await mockAPI.updateFanfic(fanficId, updates);
                
                expect(result.title).toBe(updates.title);
                expect(result.category).toBe(updates.category);
                expect(result.synopsis).toBe(updates.synopsis);
            });
        });

        runner.describe('Comment Grouping', () => {
            runner.it('should group comments by chapter', () => {
                const mockAPI = new MockAPIClient();
                const comments = mockAPI.mockComments;
                const chapters = mockAPI.mockChapters;
                
                // Group comments
                const groups = [];
                
                // General comments (no chapter)
                const generalComments = comments.filter(c => !c.chapter_id);
                if (generalComments.length > 0) {
                    groups.push({
                        title: 'General Comments',
                        comments: generalComments
                    });
                }
                
                // Chapter comments
                chapters.forEach(chapter => {
                    const chapterComments = comments.filter(c => c.chapter_id === chapter.id);
                    if (chapterComments.length > 0) {
                        groups.push({
                            title: `Chapter ${chapter.order}`,
                            comments: chapterComments
                        });
                    }
                });
                
                expect(groups).toHaveLength(2);
                expect(groups[0].title).toBe('General Comments');
                expect(groups[0].comments).toHaveLength(1);
                expect(groups[1].title).toContain('Chapter');
                expect(groups[1].comments).toHaveLength(1);
            });

            runner.it('should separate general comments from chapter comments', () => {
                const mockAPI = new MockAPIClient();
                const comments = mockAPI.mockComments;
                
                const generalComments = comments.filter(c => !c.chapter_id);
                const chapterComments = comments.filter(c => c.chapter_id);
                
                expect(generalComments).toHaveLength(1);
                expect(chapterComments).toHaveLength(1);
                expect(generalComments[0].chapter_id).toBeFalsy();
                expect(chapterComments[0].chapter_id).toBeTruthy();
            });

            runner.it('should handle fanfic with no comments', () => {
                const mockAPI = new MockAPIClient();
                mockAPI.mockComments = [];
                
                const comments = mockAPI.mockComments;
                const groups = [];
                
                const generalComments = comments.filter(c => !c.chapter_id);
                if (generalComments.length > 0) {
                    groups.push({ title: 'General', comments: generalComments });
                }
                
                expect(groups).toHaveLength(0);
            });
        });

        runner.describe('Chapter Management', () => {
            runner.it('should create new chapter with correct order', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const existingChapters = await mockAPI.getChapters(fanficId);
                const nextOrder = existingChapters.length + 1;
                
                const newChapter = await mockAPI.createChapter(fanficId, {
                    title: 'New Chapter',
                    content: 'New content',
                    order: nextOrder
                });
                
                expect(newChapter.order).toBe(nextOrder);
                expect(newChapter.fanfic_id).toBe(fanficId);
            });

            runner.it('should update chapter title and content', async () => {
                const mockAPI = new MockAPIClient();
                const chapterId = 1;
                const updates = {
                    title: 'Updated Chapter Title',
                    content: 'Updated content'
                };
                
                const result = await mockAPI.updateChapter(chapterId, updates);
                
                expect(result.title).toBe(updates.title);
                expect(result.content).toBe(updates.content);
            });

            runner.it('should delete chapter', async () => {
                const mockAPI = new MockAPIClient();
                const chapterId = 1;
                const initialCount = mockAPI.mockChapters.length;
                
                await mockAPI.deleteChapter(chapterId);
                
                expect(mockAPI.mockChapters).toHaveLength(initialCount - 1);
                const deletedChapter = mockAPI.mockChapters.find(c => c.id === chapterId);
                expect(deletedChapter).toBeFalsy();
            });
        });

        runner.describe('Question Management', () => {
            runner.it('should create new question with placeholder', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                
                const newQuestion = await mockAPI.createQuestion(fanficId, {
                    question_text: 'What is your favorite color?',
                    placeholder: 'color'
                });
                
                expect(newQuestion.question_text).toBe('What is your favorite color?');
                expect(newQuestion.placeholder).toBe('color');
                expect(newQuestion.fanfic_id).toBe(fanficId);
            });

            runner.it('should update question text and placeholder', async () => {
                const mockAPI = new MockAPIClient();
                const questionId = 1;
                const updates = {
                    question_text: 'Updated question?',
                    placeholder: 'updated_placeholder'
                };
                
                const result = await mockAPI.updateQuestion(questionId, updates);
                
                expect(result.question_text).toBe(updates.question_text);
                expect(result.placeholder).toBe(updates.placeholder);
            });

            runner.it('should delete question', async () => {
                const mockAPI = new MockAPIClient();
                const questionId = 1;
                const initialCount = mockAPI.mockQuestions.length;
                
                await mockAPI.deleteQuestion(questionId);
                
                expect(mockAPI.mockQuestions).toHaveLength(initialCount - 1);
                const deletedQuestion = mockAPI.mockQuestions.find(q => q.id === questionId);
                expect(deletedQuestion).toBeFalsy();
            });

            runner.it('should validate placeholder format', () => {
                // Valid placeholders
                expect(/^[a-zA-Z0-9_]+$/.test('name')).toBeTruthy();
                expect(/^[a-zA-Z0-9_]+$/.test('user_name')).toBeTruthy();
                expect(/^[a-zA-Z0-9_]+$/.test('place123')).toBeTruthy();
                
                // Invalid placeholders
                expect(/^[a-zA-Z0-9_]+$/.test('name-with-dash')).toBeFalsy();
                expect(/^[a-zA-Z0-9_]+$/.test('name with space')).toBeFalsy();
                expect(/^[a-zA-Z0-9_]+$/.test('name@special')).toBeFalsy();
            });
        });

        runner.describe('Fanfic Deletion', () => {
            runner.it('should delete fanfic from list', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const initialCount = mockAPI.mockFanfics.length;
                
                await mockAPI.deleteFanfic(fanficId);
                
                expect(mockAPI.mockFanfics).toHaveLength(initialCount - 1);
                const deletedFanfic = mockAPI.mockFanfics.find(f => f.id === fanficId);
                expect(deletedFanfic).toBeFalsy();
            });

            runner.it('should not affect other fanfics when deleting', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const otherFanficId = 2;
                
                await mockAPI.deleteFanfic(fanficId);
                
                const otherFanfic = mockAPI.mockFanfics.find(f => f.id === otherFanficId);
                expect(otherFanfic).toBeTruthy();
            });
        });

        runner.describe('Comment Deletion', () => {
            runner.it('should delete comment', async () => {
                const mockAPI = new MockAPIClient();
                const commentId = 1;
                const initialCount = mockAPI.mockComments.length;
                
                await mockAPI.deleteComment(commentId);
                
                expect(mockAPI.mockComments).toHaveLength(initialCount - 1);
                const deletedComment = mockAPI.mockComments.find(c => c.id === commentId);
                expect(deletedComment).toBeFalsy();
            });

            runner.it('should not affect other comments when deleting', async () => {
                const mockAPI = new MockAPIClient();
                const commentId = 1;
                const otherCommentId = 2;
                
                await mockAPI.deleteComment(commentId);
                
                const otherComment = mockAPI.mockComments.find(c => c.id === otherCommentId);
                expect(otherComment).toBeTruthy();
            });
        });

        runner.describe('Edge Cases', () => {
            runner.it('should handle empty fanfic list', async () => {
                const mockAPI = new MockAPIClient();
                mockAPI.mockFanfics = [];
                
                const result = await mockAPI.getFanfics();
                
                expect(result.fanfics).toHaveLength(0);
            });

            runner.it('should handle fanfic with no chapters', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 999;
                
                const chapters = await mockAPI.getChapters(fanficId);
                
                expect(chapters).toHaveLength(0);
            });

            runner.it('should handle fanfic with no questions', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 999;
                
                const questions = await mockAPI.getQuestions(fanficId);
                
                expect(questions).toHaveLength(0);
            });

            runner.it('should handle fanfic with no comments', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 999;
                
                const comments = await mockAPI.getComments(fanficId);
                
                expect(comments).toHaveLength(0);
            });

            runner.it('should handle very long fanfic titles', async () => {
                const mockAPI = new MockAPIClient();
                const fanficId = 1;
                const longTitle = 'A'.repeat(200);
                
                const result = await mockAPI.updateFanfic(fanficId, { title: longTitle });
                
                expect(result.title).toBe(longTitle);
                expect(result.title.length).toBe(200);
            });

            runner.it('should handle special characters in content', async () => {
                const mockAPI = new MockAPIClient();
                const chapterId = 1;
                const specialContent = 'Content with <html> & "quotes" and {{placeholders}}';
                
                const result = await mockAPI.updateChapter(chapterId, { content: specialContent });
                
                expect(result.content).toBe(specialContent);
            });
        });

        // Run all tests
        window.addEventListener('DOMContentLoaded', () => {
            runner.run();
        });
    </script>
</body>
</html>
