<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma de Fanfics Interativas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Fanfics Interativas</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="nav-link">Registrar</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card" style="max-width: 500px; margin: 2rem auto;">
                <h2 style="margin-bottom: 1.5rem; color: var(--intense-purple);">Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Senha</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                </form>
                <p style="margin-top: 1rem; text-align: center;">
                    Não tem uma conta? <a href="register.html" style="color: var(--intense-purple);">Registre-se</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initialize login form
        document.addEventListener('DOMContentLoaded', () => {
            authUI.initLoginForm();
        });
    </script>
</body>
</html>
