<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Autor - Fanfics Interativas</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Fanfics Interativas</a>
            <nav class="nav">
                <!-- Navigation will be populated by nav.js -->
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="dashboard-container">
                <!-- Sidebar with fanfic list -->
                <aside class="dashboard-sidebar">
                    <div class="sidebar-header">
                        <h2>Minhas Fanfics</h2>
                        <button class="btn btn-primary btn-sm" id="new-fanfic-btn">+ Nova Fanfic</button>
                    </div>
                    <div id="fanfics-list" class="fanfics-list">
                        <div class="loading">Carregando...</div>
                    </div>
                </aside>

                <!-- Main content area with tabs -->
                <div class="dashboard-main">
                    <div id="no-selection" class="no-selection">
                        <div class="empty-state">
                            <div class="empty-icon">📚</div>
                            <h3>Selecione uma fanfic</h3>
                            <p>Escolha uma fanfic da lista ao lado para começar a editar</p>
                        </div>
                    </div>

                    <div id="fanfic-editor" class="fanfic-editor" style="display: none;">
                        <!-- Tabs -->
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="info">Informações</button>
                            <button class="tab-btn" data-tab="chapters">Capítulos</button>
                            <button class="tab-btn" data-tab="questions">Perguntas</button>
                            <button class="tab-btn" data-tab="comments">Comentários</button>
                        </div>

                        <!-- Tab Content -->
                        <div class="tab-content">
                            <!-- Info Tab -->
                            <div id="info-tab" class="tab-pane active">
                                <div class="loading">Carregando...</div>
                            </div>

                            <!-- Chapters Tab -->
                            <div id="chapters-tab" class="tab-pane">
                                <div class="loading">Carregando...</div>
                            </div>

                            <!-- Questions Tab -->
                            <div id="questions-tab" class="tab-pane">
                                <div class="loading">Carregando...</div>
                            </div>

                            <!-- Comments Tab -->
                            <div id="comments-tab" class="tab-pane">
                                <div class="loading">Carregando...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Plataforma de Fanfics Interativas</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/nav.js"></script>
    <!-- Quill.js JavaScript -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="js/rich-text-editor.js"></script>
    <script src="js/fanfic-form.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
