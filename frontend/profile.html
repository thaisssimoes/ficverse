<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Fanfics Interativas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Fanfics Interativas</a>
            <nav class="nav">
                <!-- Navigation will be populated by nav.js -->
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="profile-container">
                <div class="card" style="max-width: 800px; margin: 2rem auto;">
                    <h2 style="margin-bottom: 2rem; color: var(--intense-purple);">Meu Perfil</h2>
                    
                    <!-- Profile Info -->
                    <div id="profile-info" class="profile-section">
                        <div class="loading">Carregando...</div>
                    </div>

                    <!-- Stats Section -->
                    <div class="profile-section" style="margin-top: 2rem;">
                        <h3 style="color: var(--intense-blue); margin-bottom: 1rem;">Estatísticas</h3>
                        <div id="profile-stats" class="stats-grid">
                            <div class="loading">Carregando...</div>
                        </div>
                    </div>

                    <!-- Recent Fanfics -->
                    <div class="profile-section" style="margin-top: 2rem;">
                        <h3 style="color: var(--intense-blue); margin-bottom: 1rem;">Minhas Fanfics Recentes</h3>
                        <div id="recent-fanfics">
                            <div class="loading">Carregando...</div>
                        </div>
                    </div>

                    <!-- Reader Profile -->
                    <div class="profile-section" style="margin-top: 2rem;">
                        <h3 style="color: var(--intense-purple); margin-bottom: 0.5rem;">Perfil de Leitor</h3>
                        <p style="color: var(--medium-gray); font-size: 0.9rem; margin-bottom: 1.5rem;">
                            Preencha suas informações aqui e elas serão usadas automaticamente em histórias interativas que utilizam essas variáveis.
                        </p>
                        <form id="reader-profile-form">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" for="rp-first_name">Primeiro Nome</label>
                                    <input type="text" id="rp-first_name" class="form-input" placeholder="ex: Ana">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="rp-last_name">Sobrenome</label>
                                    <input type="text" id="rp-last_name" class="form-input" placeholder="ex: Silva">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="rp-nickname">Apelido</label>
                                    <input type="text" id="rp-nickname" class="form-input" placeholder="ex: Ani">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="rp-eye_color">Cor dos Olhos</label>
                                    <input type="text" id="rp-eye_color" class="form-input" placeholder="ex: castanhos">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="rp-hair_color">Cor do Cabelo</label>
                                    <input type="text" id="rp-hair_color" class="form-input" placeholder="ex: preto">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="rp-favorite_color">Cor Favorita</label>
                                    <input type="text" id="rp-favorite_color" class="form-input" placeholder="ex: roxo">
                                </div>
                                <div class="form-group" style="grid-column: 1 / -1;">
                                    <label class="form-label" for="rp-favorite_food">Comida Favorita</label>
                                    <input type="text" id="rp-favorite_food" class="form-input" placeholder="ex: pizza">
                                </div>
                            </div>
                            <div style="margin-top: 1rem; display: flex; align-items: center; gap: 1rem;">
                                <button type="submit" class="btn btn-primary">Salvar Perfil de Leitor</button>
                                <span id="reader-profile-status" style="font-size: 0.9rem; color: var(--medium-gray);"></span>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Plataforma de Fanfics Interativas</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
